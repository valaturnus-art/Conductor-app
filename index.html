<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2D46F5"><meta name="description" content="Garde la bille au centre : le jeu de la conduite en douceur."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bille"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Bille</title><style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap">
<style>
/* Bille — une colonne mobile (560 px max), onglets en bas. Motif unique : le bol et la bille (cockpit, logo, ligues, billes rares). */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --ink:#141634; --muted:#5D6283; --line:#DDE0EC; --soft:#ECEEF6;
  --brand:#2D46F5; --brand-ink:#FFFFFF; --brand-deep:#1B2CB5; --brand-soft:#E4E8FF;
  --hero:#2D46F5; --hero-deep:#1B2CB5; --hero-ink:#FFFFFF;
  --pop:#FF6B2C; --pop-deep:#C94A12; --coin-ink:#C24410;
  --good:#12A765; --warn:#D98200; --bad:#E23353; --bad-ink:#FFFFFF; --bad-deep:#A81C38;
  --bowl-in:#FAFBFF; --bowl-out:#D9DEF0;
  --k-brake:#E23353; --k-accel:#D98200; --k-corner:#4F5BD5; --k-swerve:#0E8F7E; --k-fix:#C2417B; --k-shift:#7A55E0; --k-shock:#5E6B78; --k-speed:#D1202F; --k-phone:#2D3B47;
  --lg-terre:#B5653A; --lg-verre:#1797A7; --lg-agate:#E0562B; --lg-oeil:#2E9E5B; --lg-galaxie:#5B3FD6;
  --sign-bg:#FFFFFF; --sign-ring:#D1202F; --sign-ink:#111111;
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --nav-h:66px; --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F22; --surface:#161936; --ink:#EEF0FF; --muted:#9CA2CC; --line:#2A2F57; --soft:#1F2347;
  --brand:#6C7DFF; --brand-ink:#0B0E2A; --brand-deep:#3F4FD8; --brand-soft:#222A6B;
  --hero:#2B3AC9; --hero-deep:#18237E; --hero-ink:#FFFFFF;
  --pop:#FF8752; --pop-deep:#D85F27; --coin-ink:#FF9A6B;
  --good:#3DD68C; --warn:#FFB23E; --bad:#FF5C7A; --bad-ink:#2A0712; --bad-deep:#B8304C;
  --bowl-in:#262B60; --bowl-out:#14173A;
  --k-brake:#FF5C7A; --k-accel:#FFB23E; --k-corner:#8C97FF; --k-swerve:#3CCDB8; --k-fix:#F07AAE; --k-shift:#A58BFF; --k-shock:#A7B3BF; --k-speed:#FF6B6B; --k-phone:#C9D4DD;
  --lg-terre:#D88A5C; --lg-verre:#4CC9D8; --lg-agate:#FF7A4D; --lg-oeil:#56C985; --lg-galaxie:#9B85FF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F22; --surface:#161936; --ink:#EEF0FF; --muted:#9CA2CC; --line:#2A2F57; --soft:#1F2347;
  --brand:#6C7DFF; --brand-ink:#0B0E2A; --brand-deep:#3F4FD8; --brand-soft:#222A6B;
  --hero:#2B3AC9; --hero-deep:#18237E; --hero-ink:#FFFFFF;
  --pop:#FF8752; --pop-deep:#D85F27; --coin-ink:#FF9A6B;
  --good:#3DD68C; --warn:#FFB23E; --bad:#FF5C7A; --bad-ink:#2A0712; --bad-deep:#B8304C;
  --bowl-in:#262B60; --bowl-out:#14173A;
  --k-brake:#FF5C7A; --k-accel:#FFB23E; --k-corner:#8C97FF; --k-swerve:#3CCDB8; --k-fix:#F07AAE; --k-shift:#A58BFF; --k-shock:#A7B3BF; --k-speed:#FF6B6B; --k-phone:#C9D4DD;
  --lg-terre:#D88A5C; --lg-verre:#4CC9D8; --lg-agate:#FF7A4D; --lg-oeil:#56C985; --lg-galaxie:#9B85FF;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.app.driving{padding-bottom:28px}

/* en-tête : logo, billes, profil */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.logo{display:inline-flex;align-items:baseline;margin:0;font:800 30px/1 var(--font-display);letter-spacing:-.02em;color:var(--ink)}
.logo .i{position:relative;display:inline-block}
.logo .i b{position:absolute;left:50%;top:-.04em;width:.34em;height:.34em;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 34% 30%,#FFFFFF 0 13%,var(--pop) 17% 58%,var(--pop-deep) 100%);box-shadow:inset -1px -2px 3px rgba(0,0,0,.18)}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.coinchip,.me-chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:700 14px var(--font-body);font-variant-numeric:tabular-nums;white-space:nowrap}
.me-chip{padding-left:4px;cursor:pointer;min-width:0}
.me-chip .av{width:30px;height:30px;font-size:18px}
.me-chip small{font:600 12px var(--font-body);color:var(--muted)}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;flex:none;vertical-align:-.12em;background:radial-gradient(circle at 34% 30%,#FFFFFF 0 13%,var(--pop) 17% 58%,var(--pop-deep) 100%);box-shadow:inset -1px -2px 3px rgba(0,0,0,.18)}
.av{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--soft);font-size:22px;line-height:1;flex:none}
.av.big{width:56px;height:56px;font-size:32px}

/* barre d'onglets */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font:600 12px var(--font-body);cursor:pointer;position:relative}
.nav button svg{width:24px;height:24px;padding:3px 16px;box-sizing:content-box;border-radius:99px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:background .15s}
.nav button[aria-selected="true"]{color:var(--brand)}
.nav button[aria-selected="true"] svg{background:var(--brand-soft)}
.nav .dot{position:absolute;top:6px;left:calc(50% + 12px);min-width:18px;height:18px;padding-inline:5px;border-radius:99px;background:var(--pop);color:#FFFFFF;font:700 11px/18px var(--font-body)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
h2{margin:0;font:600 22px/1.2 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
h3{margin:0 0 10px;font:700 12px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.h3row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.h3row h3{margin:0}
.hint{margin:8px 0 0;color:var(--muted);font-size:13px}
.err{margin-top:12px;padding:10px 12px;border:1.5px solid var(--bad);border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.note{margin:10px 0 0;color:var(--muted);font-size:13px}
.empty{margin:0;color:var(--muted)}

/* boutons à relief : ils s'enfoncent quand on appuie */
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 var(--brand-deep);font:700 16px var(--font-body);text-align:center;cursor:pointer;text-decoration:none;transition:transform .07s,box-shadow .07s;margin-bottom:4px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.big{padding:19px 16px;font:600 18px var(--font-display);border-radius:18px}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line);padding:10px 14px;font-size:14px;width:auto;display:inline-block}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.stop{background:var(--bad);color:var(--bad-ink);box-shadow:0 4px 0 var(--bad-deep)}
.btn.stop:active{box-shadow:0 1px 0 var(--bad-deep)}
.btn.link{background:none;box-shadow:none;color:var(--muted);padding:8px 0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;width:auto;display:inline-block;margin:0}
.btn.link:active{transform:none}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-block;box-shadow:0 3px 0 var(--brand-deep)}
.btn.ghost.sm{box-shadow:0 3px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .grow{flex:1 1 0;min-width:0}
.row .btn.ghost,.sheet .btn.ghost{padding:14px 16px;font-size:16px}
.go{margin-top:14px}

/* accueil : bandeau de marque */
.hero{background:var(--hero);border-color:var(--hero);color:var(--hero-ink);padding:20px}
.hero-in{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center;margin-bottom:18px}
.hero .eyebrow{color:var(--hero-ink);opacity:.8}
.hero h2{font-size:23px}
.bowl{display:block;width:96px;height:96px}
.bowl .mb{animation:roll 6s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-3px)}50%{transform:translate(-2px,4px)}75%{transform:translate(-5px,-1px)}}
.hero .btn{background:#FFFFFF;color:#1B2CB5;box-shadow:0 5px 0 var(--hero-deep)}
.hero .btn:active{box-shadow:0 1px 0 var(--hero-deep)}
.hero .hint{color:var(--hero-ink);opacity:.85}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tg{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);font:600 13px var(--font-body);cursor:pointer}
.tg i{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;flex:none}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;transition:transform .15s}
.tg[aria-pressed="true"]{color:var(--ink);border-color:var(--brand)}
.tg[aria-pressed="true"] i{background:var(--brand)}
.tg[aria-pressed="true"] i::after{transform:translateX(12px)}
.hero .tg{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--hero-ink)}
.hero .tg[aria-pressed="true"]{border-color:#FFFFFF}
.hero .tg[aria-pressed="true"] i{background:var(--pop)}

/* profil / niveau */
.hello{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.hello b{display:block;font:600 19px/1.2 var(--font-display)}
.hello small{color:var(--muted);font-size:13px}
.xpbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:var(--pop);border-radius:99px;transition:width .6s ease-out}
.xpline{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font:600 12px var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{padding:12px 10px;border-radius:14px;background:var(--soft);min-width:0;border:0;color:inherit;text-align:left;font:inherit;display:flex;flex-direction:column;gap:4px}
button.kpi{cursor:pointer}
.kpi small{display:block;font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:flex;align-items:center;gap:6px;font:700 22px/1.1 var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{color:var(--muted);font-size:12px}

/* billes : ligues et billes rares */
.marble{display:inline-block;width:1.1em;height:1.1em;border-radius:50%;flex:none;box-shadow:inset -2px -3px 5px rgba(0,0,0,.25)}
.m-terre{background:radial-gradient(circle at 34% 30%,#F2C2A2 0 10%,#B5653A 45%,#6E3519 100%)}
.m-verre{background:radial-gradient(circle at 34% 30%,#FFFFFF 0 9%,rgba(255,255,255,0) 22%),radial-gradient(circle at 60% 65%,#9DEEF6 0 25%,#1BA7B8 65%,#0B6772 100%)}
.m-agate{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 22%),conic-gradient(from 30deg,#E0562B,#F7B267,#E0562B,#9E2B12,#F7B267,#E0562B)}
.m-oeil{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 22%),linear-gradient(115deg,rgba(0,0,0,0) 36%,#1F8A4C 39% 46%,#F2C14E 47% 53%,#1F8A4C 54% 61%,rgba(0,0,0,0) 64%),radial-gradient(circle,#E6FAEF 0 40%,#7CC79D 100%)}
.m-galaxie{background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 22%),radial-gradient(circle at 66% 60%,#FF7AD9 0 6%,rgba(255,122,217,0) 18%),radial-gradient(circle at 30% 70%,#7DF9FF 0 5%,rgba(125,249,255,0) 13%),radial-gradient(circle,#5B3FD6 0 45%,#1B0F5C 100%)}
.m-none{background:var(--line);box-shadow:none}
.lg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 12px var(--font-body);white-space:nowrap}
.lg .marble{width:16px;height:16px}
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px;text-align:center}
.ladder div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;font:600 11px/1.2 var(--font-body);color:var(--muted)}
.ladder .marble{width:28px;height:28px}
.ladder .on{background:var(--brand-soft);color:var(--ink)}
.ladder small{font:500 10px var(--font-body);color:var(--muted)}

/* défis */
.chal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chal li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft)}
.ck{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ck svg{width:13px;height:13px;stroke:#FFFFFF;stroke-width:3;fill:none;opacity:0}
.done .ck{background:var(--good);border-color:var(--good)}
.done .ck svg{opacity:1}
.done span{color:var(--muted)}
.xpv{display:inline-flex;align-items:center;gap:4px;font:700 13px var(--font-body);color:var(--coin-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.wk{margin-top:12px;padding:12px;border-radius:14px;background:var(--soft)}
.wk b{font-weight:700}
.wk small{display:block;color:var(--muted);font-size:12px;margin-top:6px}

/* coach */
.coach{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.coach .n{display:grid;place-items:center;height:56px;border-radius:50%;background:var(--soft);font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.coach b{display:block;font-weight:700}
.coach span{color:var(--muted);font-size:14px}
.trend{font:700 12px var(--font-body);margin-left:6px}
.up{color:var(--good)} .dn{color:var(--bad)} .eq{color:var(--muted)}

/* score */
.b-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--s:132px;position:relative;width:var(--s);height:var(--s);flex:none}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--soft)}
.ring .pg{transition:stroke-dashoffset .25s}
.rc-good{stroke:var(--good)} .rc-warn{stroke:var(--warn)} .rc-bad{stroke:var(--bad)} .rc-xp{stroke:var(--pop)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--s) * .34)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.ring.sm{--s:92px}
.ring.xs{--s:72px}
.b-meta{flex:1;min-width:170px}
.eyebrow{margin:0 0 4px;color:var(--muted);font:600 12px var(--font-body);letter-spacing:.02em}
.delta{display:inline-block;margin-top:6px;margin-right:8px;font:700 13px var(--font-body)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0}
.stats dt{font:700 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font:600 15px var(--font-body);font-variant-numeric:tabular-nums}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.focus{display:flex;flex-direction:column;gap:8px}
.fo{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:14px}
.fo .n{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--surface);font:700 15px var(--font-display);font-variant-numeric:tabular-nums}
.fo b{display:block;font-weight:700}
.fo span{color:var(--muted);font-size:14px}
.fo.good{grid-template-columns:minmax(0,1fr)}
.pen{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--soft);border-left:4px solid var(--bad);font-size:14px}
.xpchip{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 10px 3px 6px;border-radius:99px;background:var(--soft);color:var(--coin-ink);font:700 13px var(--font-body)}

/* axes */
.axis{display:grid;grid-template-columns:minmax(92px,112px) 1fr 34px;grid-template-areas:"l b v" ". d d";align-items:center;column-gap:10px;padding:5px 0}
.axis>span:first-child{grid-area:l;font-weight:500}
.axis .bar{grid-area:b;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.axis .bar i{display:block;height:100%;border-radius:99px;transition:width .2s}
.axis .v{grid-area:v;text-align:right;font:700 14px var(--font-body);font-variant-numeric:tabular-nums}
.axis small{grid-area:d;color:var(--muted);font-size:12px;margin-top:2px}
.live .axis{grid-template-areas:"l b v"}
.g-good{background:var(--good)} .g-warn{background:var(--warn)} .g-bad{background:var(--bad)} .g-none{background:transparent}

/* événements */
.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev b{display:block;font-weight:700}
.ev small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ev time{color:var(--muted);font:600 12px var(--font-body);font-variant-numeric:tabular-nums}
.sev{padding:2px 8px;border:1.5px solid;border-radius:99px;font:700 10px var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.sev1{color:var(--warn)} .sev2{color:var(--bad)} .sev0{color:var(--muted)}
.mk{display:inline-block;width:12px;height:12px;justify-self:center;flex:none}
.mk.brake{background:var(--k-brake);border-radius:50%}
.mk.accel{background:var(--k-accel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.corner{background:var(--k-corner);transform:rotate(45deg) scale(.78)}
.mk.swerve{background:var(--k-swerve);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.mk.fix{background:var(--k-fix);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
.mk.shift{background:var(--k-shift);border-radius:3px;transform:scale(.8)}

<script>
/* Bille — moteur d'analyse de conduite (pur, sans DOM). v3 : + limitations de vitesse, téléphone manipulé, éco-dynamisme (RDE). */
const PL = (() => {
  'use strict';
  const G = 9.81, D2R = Math.PI / 180;
  const CFG = {
    // Seuils d'événements (m/s²). La télématique signale le freinage brusque dès 0,3 g et considère < 0,2 g normal :
    // on est volontairement plus strict (0,25 g / 0,2 g / 0,25 g).
    brake:  { mod: 2.5, sev: 4.0 },
    accel:  { mod: 2.0, sev: 3.2 },
    corner: { mod: 2.5, sev: 4.0 },
    ring:   { warn: 2.5, bad: 4.0 },   // repères du disque en direct
    shock:  { mod: 2.5, sev: 5, noiseK: 6 },   // choc vertical (nid-de-poule, dos-d'âne) ; seuil = max(mod, noiseK × bruit de fond)
    bump:   { fastKmh: 30, peak: 4 },
    shockRefractory: 1.0, minShockSpeed: 3, shockHz: 12,
    rollGain: 2.5, rollHz: 6, sideRatio: 0.15,
    lateLead: -0.5,                    // freinage « tardif » : on ne décélérait pas déjà 1,2 à 4 s avant
    minEventS: 0.3, minCornerSpeed: 3, stopSpeed: 0.5, movingSpeed: 1,
    smoothHz: 3, fastHz: 4, hysteresis: 0.7,   // lissage : 3 filtres de 3 Hz (≈ 1,5 Hz) pour l'affichage ET la détection ; 4 Hz (2 filtres) pour volant et vitesses
    gaugeDead: 0.7, gaugeDecay: 0.35,
    // Coup de volant : aller-retour latéral rapide (≥ 1,3 m/s² de chaque côté en moins de 2,2 s).
    swerve: { amp: 1.3, minSpeed: 8, maxGap: 2.2, jerkMod: 2.6, jerkSev: 6 },
    // Redressement : dérive lente (≥ 0,35 °/s) puis correction vive en sens inverse (≥ 5 °/s, < 1,6 s) : inattention.
    fix: { spike: 5, sev: 9, quiet: 2.6, drift: 0.3, agree: 0.7, minSpeed: 8, end: 2.5, maxDur: 1.6 },
    // Passage de vitesse : creux d'accélération en phase d'accélération (rupture de couple), puis reprise.
    shift: { minDepth: 0.8, preMin: 0.7, open: 0.4, recover: 0.3, maxFall: 1.0, maxDip: 2.0, harsh: 1.0, sev: 1.9, slope: 5, slopeSev: 9, reb: 0.9 },
    minKm: 3,
    // Excès de vitesse (limite fournie par l'appli, OpenStreetMap) : tolérance des radars (5 km/h sous 100, 5 % au-delà),
    // au moins 5 s ; sévère dès +20 km/h (seuil de la classe supérieure d'amende).
    speed: { tol: 5, tolPct: 0.05, minS: 5, sev: 20, k: 1.2, share: [0.02, 0.2] },
    // Téléphone manipulé en roulant (> 15 km/h) : écran touché ou téléphone déplacé ; une fois par 20 s ; −8 points chacun, 30 max.
    phone: { minSpeed: 4.2, gap: 20, pen: 8, maxPen: 30 },
    phaseMin: 0.8, phaseTime: 8,
    // Intensité : percentile 90 de l'effort quand on freine / accélère / tourne (100 sous a, 0 au-delà de b).
    inten: { brake: [1.6, 4.0], accel: [1.2, 2.8], corner: [1.5, 3.6] },
    jerk: [0.4, 1.5], steer: [0.5, 1.8]
  };
  // Pondération des axes ; le score final mélange la moyenne et le plus faible axe (un point noir pèse).
  const W = { freinage: .24, acceleration: .16, virages: .20, trajectoire: .20, fluidite: .20, vitesse: .22 };
  const AXIS_K = { freinage: 1.7, acceleration: 1.7, virages: 1.7, trajectoire: 1.3 };

  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
  const madd = (a, s, b) => [a[0]+s*b[0], a[1]+s*b[1], a[2]+s*b[2]];
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const lin = (x, a, b) => clamp((b - x) / (b - a), 0, 1);   // 1 sous a, 0 au-delà de b
  const fin = x => x !== null && x !== undefined && Number.isFinite(x);
  const BIN = 0.1, NB = 81;

  class Engine {
    constructor(opts = {}) { this.mount = opts.mount === 'vent' ? 'vent' : 'free'; this.reset(); }

    reset() {
      this.t0 = null; this.tPrev = null; this.t = 0;
      this.g = null; this.gBuf = []; this.gCal = null;
      this.speed = null; this.fix = null; this.dist = 0;
      this.movingS = 0; this.maxV = 0; this.moveStart = null;
      this.basis = null; this.f = null;
      this.cal = { n: 0, sx: 0, sy: 0, den: 0 };
      this.hAcc = [0, 0]; this.hN = 0;
      this.sm = [0, 0, 0, 0, 0, 0];
      this.aLong = 0; this.aLat = 0;
      this.open = {}; this.events = []; this.evSeq = 0; this.lastEvent = null;
      this.series = []; this.nextSeriesT = 0;
      this.trail = []; this.nextTrailT = 0; this.hist = []; this.nextTickT = 0;
      this.vz = 0; this.shock = null; this.lastShock = -9;
      this.rs = 1; this.ventOk = false; this.fSource = null;
      this.vh = 0; this.vzSlow = 0; this.lz = 0; this.lzSlow = 0; this.zL = 0; this.zR = 0; this.pk = [0, 0]; this.vNoise = 0.3; this.latLearned = false; this.gapS = 0; this.lastMotionT = null;
      this.fxQ = null; this.shocks = 0;
      this.fd = [0, 0, 0, 0]; this.dLong = 0; this.dLat = 0; this.fLong = 0; this.fLat = 0; this.liveMag = 0;
      this.latSign = 1; this.latAcc = 0; this.latN = 0; this.latCal = { sum: 0, den: 0, n: 0 }; this.prevHead = null;
      this.tickT = null; this.prevA = [0, 0]; this.jerkSq = 0; this.jerkT = 0;
      this.recalCount = 0;
      this.limit = null; this.limDist = 0; this.overDist = 0; this.spd = null; this.phoneT = -1e9;

    _lead(ts) {
      const w = this.hist.filter(h => h[0] >= ts - 4 && h[0] <= ts - 1.2);
      return w.length ? w.reduce((s, h) => s + h[1], 0) / w.length : null;
    }

    /** Coup de volant : un pic latéral puis un pic de signe opposé moins de 2,2 s plus tard, avec un fort à-coup. */
    _swerve(x, v, ts) {
      const ax = Math.abs(x), sgn = Math.sign(x), s = this.sg;
      if (s && (sgn !== s.sign || ax < 0.35)) { this._endSeg(s); this.sg = null; }
      if (!this.sg) { if (ax >= 0.35) this.sg = { sign: sgn, peak: ax, tPeak: ts, v }; }
      else if (ax > this.sg.peak) { this.sg.peak = ax; this.sg.tPeak = ts; this.sg.v = v; }
    }
    _endSeg(s) {
      const C = CFG.swerve;
      if (s.peak < C.amp || s.v < C.minSpeed) return;
      const p = this.sgPrev; this.sgPrev = s;
      if (!p || p.sign !== -s.sign || s.tPeak - p.tPeak > C.maxGap) return;
      const gap = Math.max(0.3, s.tPeak - p.tPeak), jerk = (p.peak + s.peak) / gap;
      if (jerk < C.jerkMod) return;
      const lo = p.tPeak - 1.5, hi = s.tPeak + 1.5;
      for (const e of this.events) if (e.kind === 'corner' && e.t >= lo && e.t <= hi) e.part = true;
      if (this.fxQ && this.fxQ.t >= lo && this.fxQ.t <= hi) this.fxQ = null;   // le « redressement » faisait partie du coup de volant
      this.mute = [lo, hi];
      this._push({ kind: 'swerve', t: (p.tPeak + s.tPeak) / 2, peak: Math.min(p.peak, s.peak), jerk, v: s.v * 3.6, dur: gap, sev: jerk >= C.jerkSev ? 2 : 1 }, true);
      this.sgPrev = null;
    }

    /** Redressement : la voiture dérivait doucement, puis le conducteur corrige d'un coup (inattention). */
    _tickFix(ts, v) {
      const C = CFG.fix;
      if (this.fxQ && ts >= this.fxQ.due) { const q = this.fxQ; this.fxQ = null; this._push(q, true); }
      if (!this.gyroOn || v < C.minSpeed) { this.fx = null; return; }
      const y = this.yF / D2R, o = this.fx;
      if (o) {
        const same = Math.sign(y) === o.sign;
        if (same && Math.abs(y) > o.peak) { o.peak = Math.abs(y); o.tPk = ts; }
        const dur = ts - o.t0;
        if (Math.abs(y) < C.end || !same) {
          if (dur <= C.maxDur) this.fxQ = { kind: 'fix', t: o.tPk, peak: o.peak, drift: o.drift, v: o.v, dur, sev: o.peak >= C.sev ? 2 : 1, due: ts + 3 };

        } else if (dur > C.maxDur) { this.fx = null; this.fxLast = ts; }   // un vrai virage, pas un redressement
        return;
      }
      if (Math.abs(y) < C.spike || ts - this.fxLast < 2.5) return;

      if (w.length < 20) return;
      const sgn = Math.sign(y); let m = 0, mx = 0, agree = 0;
      for (const b of w) { m += b[1]; mx = Math.max(mx, Math.abs(b[1])); if (Math.sign(b[1]) === -sgn) agree++; }
      m /= w.length; agree /= w.length;
      if (mx <= C.quiet && Math.sign(m) === -sgn && Math.abs(m) >= C.drift && agree >= C.agree) this.fx = { t0: ts, sign: sgn, peak: Math.abs(y), tPk: ts, drift: Math.abs(m), v: v * 3.6 };
    }

    /** Passage de vitesse : creux de l'accélération en pleine accélération, puis reprise. Profondeur et à-coup = brusquerie. */
    _tickShift(ts, v) {
      const C = CFG.shift, cur = this.fLong, h = this.hist;
      const pend = this.shiftPend;
      if (pend) {

      const o = this.dip;
      if (o) {

    _endShift(o) {

      if (sev) this._push({ kind: 'shift', t: o.tMin, peak: depth, jerk: o.maxSlope, reb, v: o.v, dur: o.rebT - o.t0, sev }, true);
    }

    _shockCheck(vh, sR, v, ts) {
      const x = Math.abs(vh), th = CFG.shock, o = this.shock, rel = Math.sign(vh) * sR;
      if (o) {
        if (x > o.peak) { o.peak = x; o.rel = rel; }
        if (ts - o.t0 >= 0.25) this._closeShock(ts);
      } else if (x >= Math.max(th.mod, th.noiseK * this.vNoise) && v >= CFG.minShockSpeed && ts - this.lastShock > CFG.shockRefractory) {
        this.shock = { t0: ts, peak: x, rel, v: v * 3.6 };
      }
    }
    _closeShock(ts) {
      const o = this.shock; if (!o) return;
      const ratio = o.rel / o.peak;
      const side = !this.f ? null : Math.abs(ratio) <= CFG.sideRatio ? 'both' : !this.latLearned && this.mount !== 'vent' ? 'one' : ratio > 0 ? 'left' : 'right';
      // Un dos-d'âne franchi trop vite est un défaut d'anticipation du conducteur ; un nid-de-poule, non.
      const fast = side === 'both' && o.v >= CFG.bump.fastKmh && o.peak >= CFG.bump.peak;
      this._push({ kind: 'shock', t: o.t0, peak: o.peak, v: o.v, dur: 0.25, sev: o.peak >= CFG.shock.sev ? 2 : 1, side, fast }, fast);
      this.shock = null; this.lastShock = ts;
    }

    finish() {
      for (const k of Object.keys(this.open)) this._close(k, this.t);
      if (this.sg) { this._endSeg(this.sg); this.sg = null; }
      if (this.fxQ) { const q = this.fxQ; this.fxQ = null; this._push(q, true); }
      if (this.shiftPend) { const p = this.shiftPend; this.shiftPend = null; this._endShift(p); }
      this._closeShock(this.t); this._closeSpeed();
      return this.summary();
    }

    summary() {
      const km = this.dist / 1000, base = Math.max(km, CFG.minKm);
      const wt = e => e.kind === 'shock' ? 1 : (e.sev === 2 ? 2 : 1) * (e.late ? 1.4 : 1) * (e.part ? 0.5 : 1);
      const wsum = f => this.events.reduce((s, e) => f(e) ? s + wt(e) : s, 0);
      const expo = (w, k) => 100 * Math.exp(-(w / base) / k);
      const inten = (k) => { const p = this._p90(k); return p === null ? null : 100 * lin(p, CFG.inten[k][0], CFG.inten[k][1]); };
      const mix = (E, I) => Math.round(I === null ? E : 0.6 * E + 0.4 * I);
      const cnt = f => this.events.filter(f).length;
      const rms = this.jerkT > 5 ? Math.sqrt(this.jerkSq / this.jerkT) : null;
      const steerRms = this.gyroOn && this.steerT > 20 ? Math.sqrt(this.steerSq / this.steerT) : null;
      const nShift = this.shiftN, shiftW = wsum(e => e.kind === 'shift');
      const Sh = nShift >= 2 ? 100 * Math.exp(-(shiftW / nShift) / 0.6) : null;
      const J = rms === null ? 100 : 100 * lin(rms, CFG.jerk[0], CFG.jerk[1]);
      const Rv = steerRms === null ? null : 100 * lin(steerRms, CFG.steer[0], CFG.steer[1]);
      const axes = {
        freinage: mix(expo(wsum(e => e.kind === 'brake' || (e.kind === 'shock' && e.fast)), AXIS_K.freinage), inten('brake')),
        acceleration: mix(expo(wsum(e => e.kind === 'accel'), AXIS_K.acceleration), inten('accel')),
        virages: mix(expo(wsum(e => e.kind === 'corner'), AXIS_K.virages), inten('corner')),
        trajectoire: mix(expo(wsum(e => e.kind === 'swerve' || e.kind === 'fix'), AXIS_K.trajectoire), Rv),
        fluidite: Math.round(Sh === null ? J : 0.65 * J + 0.35 * Sh),
        vitesse: null

      // Vitesse : seulement si la limitation est connue sur au moins 0,5 km et 30 % du trajet.
      const limKm = this.limDist / 1000, overShare = this.limDist > 0 ? this.overDist / this.limDist : 0;
      if (limKm >= 0.5 && this.limDist >= 0.3 * this.dist) {
        const sw = wsum(e => e.kind === 'speed'), c = CFG.speed;
        axes.vitesse = mix(100 * Math.exp(-(sw / Math.max(limKm, CFG.minKm)) / c.k), 100 * lin(overShare, c.share[0], c.share[1]));
      }
      let wm = 0, ws = 0, mn = 100; for (const k in W) { if (axes[k] === null) continue; wm += axes[k] * W[k]; ws += W[k]; mn = Math.min(mn, axes[k]); }
      wm /= ws;
      const nPhone = cnt(e => e.kind === 'phone'), phonePen = Math.min(CFG.phone.maxPen, CFG.phone.pen * nPhone);
      const score = Math.max(0, Math.round(0.7 * wm + 0.3 * mn) - phonePen);
      const moving = this.movingS;
      return {
        score, axes, km, durationS: this.t, movingS: moving,
        avgKmh: moving > 5 ? km / (moving / 3600) : 0, maxKmh: this.maxV,
        counts: {
          brake: cnt(e => e.kind === 'brake'), late: cnt(e => e.late), accel: cnt(e => e.kind === 'accel'), corner: cnt(e => e.kind === 'corner'),
          swerve: cnt(e => e.kind === 'swerve'), fix: cnt(e => e.kind === 'fix'), shift: nShift, shiftHarsh: cnt(e => e.kind === 'shift'),
          shock: cnt(e => e.kind === 'shock'), fast: cnt(e => e.fast), speed: cnt(e => e.kind === 'speed'), phone: nPhone
        },
        phonePen, speedShare: Math.round(overShare * 1000) / 1000, limKm: Math.round(limKm * 10) / 10, eco: this._ecoSummary(),
        jerkRms: rms, steerRms, gyro: this.gyroOn, coverage: this.t > 5 ? clamp(1 - this.gapS / this.t, 0, 1) : 1,
        streakBest: Math.max(this.bestStreak, this.moveStart === null ? 0 : this.t - this.lastBadT),
        p90: { brake: this._p90('brake'), accel: this._p90('accel'), corner: this._p90('corner') }
      };
    }
  }

  /* ---------- Simulateur : trajet de démonstration (téléphone sur la grille ou posé au hasard) ---------- */
  const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // [début s, durée s, accélération m/s², brusque?]
  const LONG = [[8,10,1.5,0],[40,4,-1.5,0],[46,6,1.8,0],[75,4,1.4,0],[95,5,-1.4,0],[110,3,2.9,1],
                [150,2.6,-4.8,1],[158,8,1.2,0],[177,11,-1.5,3],[189,7,1.2,3],[196,4,-0.8,0],[200,3,-3.2,1],[210,8,1.4,2]].map(([t0,d,a,h]) => ({t0,d,a,h}));
  const LAT = [[41,4,2.0,0],[100,3.5,-3.3,1],[120,4,1.6,0],[170,3.5,3.4,1],[204,4,2.2,0]].map(([t0,d,a,h]) => ({t0,d,a,h}));
  // Facteurs par type d'impulsion : 0 = normale, 1 = brusque, 2 = prise de vitesse.
  // Chocs : [instant s, amplitude m/s², côté] (+1 roue gauche, −1 roue droite, 0 dos d'âne : deux essieux).
  const SHOCK_ROLL = 0.4;
  const SHOCKS = [[62, 8, 1], [133, 6, -1], [188, 9, 0], [231, 2.5, 1]]
    .flatMap(([t0, A, side]) => side === 0 ? [[t0, A, 0], [t0 + 0.3, 0.8 * A, 0]] : [[t0, A, side]]);
  const shockAt = t => {
    let z = 0, l = 0;

      const x = t - t0; if (x < 0 || x >= 0.6) continue;
      const w = A * Math.exp(-x / 0.06) * Math.sin(2 * Math.PI * 10 * x);
      z += w; l += -side * SHOCK_ROLL * w;
    }
    return [z, l];
  };
  // Passages de vitesse (boîte manuelle) : [instant s]. Profondeur du creux, durée, rampe, rebond selon le style.
  const SHIFTS = [12.5, 16.2, 49, 111.8, 161, 164.5, 213, 216.5];
  const SHIFT_STYLE = { calm: { depth: 0.5, d: 0.55, ramp: 0.4, reb: 0 }, normal: { depth: 1.0, d: 0.6, ramp: 0.3, reb: 0.25 }, rough: { depth: 2.4, d: 0.55, ramp: 0.12, reb: 1.0 } };
const SHIFT_K = [0.8, 1.3, 0.8, 1.0, 1.3, 0.8, 0.8, 1.0];   // les passages ne se ressemblent pas tous
  const shiftAt = (t, S) => {
    let a = 0;
    for (let i = 0; i < SHIFTS.length; i++) {
      const t0 = SHIFTS[i], x = t - t0, k = SHIFT_K[i]; if (x < 0 || x > S.d + 2 * S.ramp + 0.5) continue;
      const e = Math.min(smooth(x / S.ramp), smooth((S.d + S.ramp - x) / S.ramp));
      a -= k * S.depth * Math.max(0, e);
      const y = x - (S.d + S.ramp); if (y >= 0 && y < 0.3) a += k * S.reb * Math.sin(Math.PI * y / 0.3);
    }
    return a;
  };
  // Coups de volant : un aller-retour latéral (sinus complet). Redressements : dérive lente puis correction vive.
  const SWERVES = [[88, 'calm'], [236, 'rough']];
  const SWERVE_STYLE = { calm: { A: 1.0, T: 4.0 }, normal: { A: 2.7, T: 3.2 }, rough: { A: 4.2, T: 2.4 } };
  const FIXES = [[140, 'normal'], [225, 'normal']];
  const FIX_STYLE = { calm: null, normal: { drift: -0.28, spike: 1.7 }, rough: { drift: -0.35, spike: 2.4 } };
  const wander = (t, A, ph) => A * D2R * (Math.sin(2 * Math.PI * t / 6.3 + ph[0]) + 0.6 * Math.sin(2 * Math.PI * t / 9.7 + ph[1]));
  const swerveAt = (t, S, style) => {
    let l = 0;

  };

    let l = 0; if (!F) return 0;

      const x = t - t0; if (x >= 0 && x < 0.7) l += F.spike * Math.sin(Math.PI * x / 0.7);

  };
  // Téléphone en portrait sur la grille, penché de `tilt`°, pince décalée de `yaw`° par rapport à l'axe de la voiture.
  const ventR = (tilt = 12, yaw = 8) => {
    const th = tilt * Math.PI / 180, ps = yaw * Math.PI / 180, c = Math.cos, s = Math.sin;
    const M = [[0, -1, 0], [s(th), 0, c(th)], [-c(th), 0, s(th)]], Z = [[c(ps), -s(ps), 0], [s(ps), c(ps), 0], [0, 0, 1]];
    return M.map(row => [0, 1, 2].map(j => row[0] * Z[0][j] + row[1] * Z[1][j] + row[2] * Z[2][j]));
  };
  const STYLE = { calm: [1, 0.45, 0.75, 1], normal: [1, 1, 1, 1], rough: [1.1, 1.3, 1.1, 0] };   // 3 = ralentir avant le dos d'âne (sauf conducteur nerveux)
  const WANDER = { calm: 0.35, normal: 0.6, rough: 1.0 };
  const scaleP = (p, k) => p.h === 1 && k < 1
    ? { t0: p.t0, d: (p.d - TR) / k + TR, a: p.a * k }
    : { t0: p.t0, d: p.d, a: p.a * k };
  const rot = (yaw, pitch, roll) => {
    const c = Math.cos, s = Math.sin;

    const Rx = [[1,0,0],[0,c(pitch),-s(pitch)],[0,s(pitch),c(pitch)]];
    const Ry = [[c(roll),0,s(roll)],[0,1,0],[-s(roll),0,c(roll)]];
    const mm = (A, B) => A.map(row => [0,1,2].map(j => row[0]*B[0][j] + row[1]*B[1][j] + row[2]*B[2][j]));
    return mm(Rz, mm(Rx, Ry));
  };

  class Sim {
    constructor({ style = 'normal', seed = 7, mount = 'vent', gearbox = 'manual', hum = 0 } = {}) {
      this.hum = hum;   // vibrations moteur/route repliées dans les capteurs (écart type en m/s², sur chaque axe)
      this.rng = mulberry32(seed); this.style = STYLE[style] ? style : 'normal'; this.gearbox = gearbox;
      const k = STYLE[this.style];

      this.R = mount === 'random' ? rot(2.53, -1.08, 0.12) : ventR();

      this.bias = [0.0061, -0.0035, 0.0043];   // biais du gyroscope (rad/s) dans les axes de l'appareil
      this.dt = 0.02; this.t = 0; this.v = 0; this.heading = 40; this.nextFix = 1; this.stopAt = null; this.done = false;
    }
    _n(s) { const r = this.rng; return s * Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r()); }
    step() {
      const t = this.t, dt = this.dt, st = this.style;
      let a = 0; for (const p of this.long) a += pulse(t, p);
      if (this.gearbox === 'manual') a += shiftAt(t, SHIFT_STYLE[st]);
      if (t >= 250) a -= smooth((t - 250) / 1.5) * Math.min(1.6, 0.35 * this.v + 0.15);
      const vNew = Math.max(0, this.v + a * dt), aReal = (vNew - this.v) / dt; this.v = vNew;
      let lat = 0; for (const p of this.lat) lat += pulse(t, p);

      lat *= ramp;
      const vv = Math.max(this.v, 1);
      lat += (swerveAt(t, SWERVE_STYLE[st], st) + fixAt(t, FIX_STYLE[st])) * ramp;
      if (this.v > 6) lat += vv * wander(t, WANDER[st], this.ph);
      const yaw = lat / vv;                                   // rad/s, + = tourne à gauche

      const m = this.v > 0.5 ? 1 : 0.1, tw = 2 * Math.PI * t;

      const sh = this.v > 3 ? shockAt(t) : [0, 0];

      const rv = [aReal + vib(0) + this._n(0.08) + hm(), lat + vib(1.3) + this._n(0.08) + sh[1] + hm(), G + vib(2.1) + this._n(0.08) + sh[0] + hm()];
      const R = this.R;
      const wv = [0, 0, yaw];
      const gy = i => (dot(R[i], wv) + this.bias[i] + this._n(0.0025 + 0.004 * this.hum)) / D2R;   // °/s, axes de l'appareil
      const out = { t, ax: dot(R[0], rv), ay: dot(R[1], rv), az: dot(R[2], rv), gx: gy(0), gy: gy(1), gz: gy(2), fix: null, heading: null, tf: t + dt };
      this.t += dt;
      if (this.t >= this.nextFix) { this.nextFix += 1; out.fix = Math.max(0, this.v + this._n(0.12)); out.heading = ((this.heading + this._n(0.8)) % 360 + 360) % 360; }
      if (this.t > 252 && this.v < 0.02) { if (this.stopAt === null) this.stopAt = this.t; if (this.t - this.stopAt >= 5) this.done = true; }
      return out;
    }
    get progress() { return Math.min(1, this.t / 270); }
  }

  /* ---------- Import CSV : t, ax, ay, az, speed[, heading][, gx, gy, gz en °/s] ---------- */
  function parseCsv(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return [];
    const delim = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';

  const yMax = Math.ceil(vmax / 20) * 20;
  const x = t => m.l + (W - m.l - m.r) * Math.min(t, dur) / dur, y = v => m.t + (H - m.t - m.b) * (1 - v / yMax);
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vitesse au cours du trajet, limitations et événements">`;
  for (let v = 0; v <= yMax; v += 20) out += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const step = [15, 30, 60, 120, 300, 600, 900, 1800].find(s => dur / s <= 6) || 3600;
  for (let t = 0; t <= dur; t += step) out += `<text x="${x(t)}" y="${H - 5}" text-anchor="${t === 0 ? 'start' : 'middle'}">${clock(t)}</text>`;
  if (pts.length) {
    const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('');
    out += `<path class="ar" d="${d}L${x(pts[pts.length - 1].t).toFixed(1)} ${y(0)}L${x(pts[0].t).toFixed(1)} ${y(0)}Z"/><path class="ln" d="${d}"/>`;
  }
  // limitation connue : marches en pointillés
  let d = '';
  for (let i = 0; i < lims.length; i++) { const [t0, l] = lims[i], t1 = i + 1 < lims.length ? lims[i + 1][0] : dur; if (l) d += `M${x(t0).toFixed(1)} ${y(l).toFixed(1)}H${x(t1).toFixed(1)}`; }
  if (d) out += `<path class="lim" d="${d}"/>`;
  for (const e of trip.events) out += markerSVG(e, +x(e.t).toFixed(1), +y(Math.min(e.v || 0, yMax)).toFixed(1));
  return out + '</svg>';
}

// Carte du trajet sans fond de carte : le tracé GPS et l'endroit de chaque événement, avec une échelle.
function mapSVG(trip, W) {
  const p = trip.path || []; if (p.length < 2) return '';
  let a = 90, b = -90, c = 180, d = -180;
  for (const q of p) { a = Math.min(a, q[1]); b = Math.max(b, q[1]); c = Math.min(c, q[2]); d = Math.max(d, q[2]); }
  const kx = Math.cos((a + b) / 2 * Math.PI / 180), w = Math.max((d - c) * kx, 1e-5), h = Math.max(b - a, 1e-5), pad = 16;
  const H = Math.round(Math.max(150, Math.min(300, (W - 2 * pad) * h / w + 2 * pad)));
  const sc = Math.min((W - 2 * pad) / w, (H - 2 * pad) / h), ox = (W - w * sc) / 2, oy = (H - h * sc) / 2;
  const X = lon => +(ox + (lon - c) * kx * sc).toFixed(1), Y = lat => +(oy + (b - lat) * sc).toFixed(1);
  const line = p.map((q, i) => (i ? 'L' : 'M') + X(q[2]) + ' ' + Y(q[1])).join('');
  let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tracé du trajet et lieux des événements"><path class="route-bg" d="${line}"/><path class="route" d="${line}"/>`;
  const s = p[0], e = p[p.length - 1];
  out += `<circle class="st" cx="${X(s[2])}" cy="${Y(s[1])}" r="6"/><rect class="en" x="${X(e[2]) - 5}" y="${Y(e[1]) - 5}" width="10" height="10" rx="2"/>`;
  for (const ev of trip.events) if (ev.ll) out += markerSVG(ev, X(ev.ll[1]), Y(ev.ll[0]));
  // échelle : 1 degré de latitude ≈ 111,32 km
  const pxPerM = sc / 111320, nice = [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000].filter(m => m * pxPerM <= W / 4).pop() || 50;
  const L = nice * pxPerM;
  out += `<path class="gl" d="M10 ${H - 10}h${L.toFixed(1)}M10 ${H - 14}v8M${(10 + L).toFixed(1)} ${H - 14}v8" stroke-width="1.5"/><text x="${(14 + L).toFixed(1)}" y="${H - 6}">${nice >= 1000 ? nice / 1000 + ' km' : nice + ' m'}</text>`;
  return out + '</svg>';
}

function ecoHTML(eco) {
  if (!eco) return '';
  const r = eco.ratio, label = r < 0.75 ? 'Sobre' : r < 1 ? 'Dynamique' : 'Trop vif', pos = Math.min(r, 1.4) / 1.4 * 100;
  const z = (a, b2, col) => `<span style="left:${a / 1.4 * 100}%;width:${(b2 - a) / 1.4 * 100}%;background:var(${col})"></span>`;
  return `<div class="sec"><div class="h3row"><h3>Éco-dynamisme</h3><span class="pill ${r < 0.75 ? 'ok' : r < 1 ? 'on' : 'ko'}">${label}</span></div>
    <div class="eco"><div class="eco-bar" role="img" aria-label="${fmt(r * 100)} % de la limite de la norme RDE">${z(0, 0.75, '--good')}${z(0.75, 1, '--warn')}${z(1, 1.4, '--bad')}<i style="left:${pos}%"></i></div>
    <div class="eco-sc"><span style="left:0">0</span><span style="left:${100 / 1.4}%;transform:translateX(-50%)">limite RDE</span><span style="right:0">+40 %</span></div>
    <p class="note" style="margin-top:2px">Tes accélérations les plus vives (95ᵉ centile de vitesse × accélération : ${fmt(eco.va95, 1)} m²/s³) atteignent ${fmt(r * 100)} % de la limite fixée par la norme européenne RDE pour ${fmt(eco.vAvg)} km/h de moyenne (${fmt(eco.vaMax, 1)} m²/s³). En dessous de 75 %, tu consommes moins.</p></div></div>`;
}

/* ---------- Bilan d'un trajet ---------- */
function bilanHTML(trip) {
  const s = trip.sum, c = s.counts || {}, i = trips.findIndex(t => t.id === trip.id), prev = i >= 0 ? trips[i + 1] : null;
  const dl = prev ? s.score - prev.sum.score : null, W = contentWidth();
  const weak = AXES.map(([k, l]) => [k, l, s.axes[k]]).filter(a => has(a[2]) && a[2] < 85).sort((a, b) => a[2] - b[2]).slice(0, 2);
  const focus = weak.length ? weak.map(([k, l, v]) => `<div class="fo"><span class="n">${v}</span><div><b>${l}</b><span>${esc(axisInfo(k, s).advice)}</span></div></div>`).join('')
    : `<div class="fo good"><div><b>Rien à corriger</b><span>La bille est restée au centre sur tous les axes.</span></div></div>`;
  const same = PG.sameRoute(trips, trip), sameAvg = same.length ? Math.round(same.reduce((a, t) => a + t.sum.score, 0) / same.length) : null;
  const evs = trip.events.length ? `<ul class="evs">${trip.events.map(evRow).join('')}</ul>` : '<p class="empty">Aucun événement.</p>';
  const cov = has(s.coverage) ? s.coverage : 1;
  return `<article class="card" aria-label="Bilan du trajet">
    <div class="b-head">${ring(s.score)}<div class="b-meta">
      <p class="eyebrow">${esc(dateLabel(trip.ts) + (trip.recovered ? ' · récupéré après interruption' : ''))}</p>
      <h2>${grade(s.score)}</h2>
      ${dl === null ? '' : `<span class="delta ${dl > 0 ? 'up' : dl < 0 ? 'dn' : 'eq'}">${dl > 0 ? '▲ +' : dl < 0 ? '▼ ' : '= '}${dl} vs précédent</span>`}${trip.xp ? `<span class="xpchip">+${billes(trip.xp)}</span>` : ''}
      <dl class="stats"><div><dt>Distance</dt><dd>${fmt(s.km, 1)} km</dd></div><div><dt>Durée</dt><dd>${clock(s.durationS)}</dd></div><div><dt>Moy.</dt><dd>${fmt(s.avgKmh)} km/h</dd></div><div><dt>Série max</dt><dd>${clock(s.streakBest || 0)}</dd></div></dl>
    </div></div>
    ${s.phonePen ? `<p class="pen">Téléphone manipulé ${c.phone} fois en roulant : −${s.phonePen} points sur le score.</p>` : ''}
    ${cov < 0.9 ? `<p class="banner">Capteurs coupés pendant ${fmt((1 - cov) * 100)} % du trajet (écran verrouillé ?) : bilan incomplet.</p>` : ''}
    ${same.length ? `<p class="note">Trajet habituel, déjà fait ${same.length} fois · ta moyenne ici : <b>${sameAvg}</b> ${s.score > sameAvg ? '<span class="up">▲</span>' : s.score < sameAvg ? '<span class="dn">▼</span>' : ''}</p>` : ''}
    <div class="chips">${chipsHTML(trip.events)}</div>
    <div class="sec"><h3>À travailler</h3><div class="focus">${focus}</div></div>
    <div class="sec"><h3>Les 6 axes</h3>${AXES.map(([k, l]) => axisRow(l, s.axes[k], axisInfo(k, s).detail)).join('')}</div>
    ${trip.path && trip.path.length > 1 ? `<div class="sec"><h3>Où ça s’est passé</h3><div class="mapbox">${mapSVG(trip, W - 16)}</div>${legendHTML(trip.events.filter(e => e.ll))}</div>` : ''}
    <div class="sec"><h3>Vitesse (km/h)${(trip.lims || []).some(l => l[1]) ? ', limitation' : ''} et événements</h3>${chartSVG(trip, W)}${legendHTML(trip.events)}</div>
    ${ecoHTML(s.eco)}
    <div class="sec"><h3>Événements (${trip.events.length})</h3>${evs}</div>
  </article>`;
}

/* ---------- Progrès ---------- */
function renderProgress() {
  const now = Date.now(), lv = PG.levelOf(G.xp), W = contentWidth();
  // 8 dernières semaines
  const weeks = []; for (let i = 7; i >= 0; i--) weeks.push(PG.weekStats(trips, PG.weekKey(now - i * 7 * DAY)));
  const H = 130, m = { l: 26, b: 20, t: 8 }, bw = (W - m.l) / 8, y = v => m.t + (H - m.t - m.b) * (1 - v / 100);
  let wsvg = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score des 8 dernières semaines">`;
  for (const v of [0, 50, 100]) wsvg += `<line class="gl" x1="${m.l}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  weeks.forEach((w, i) => {
    const x0 = m.l + i * bw + bw * 0.18, ww = bw * 0.64;
    if (has(w.score)) wsvg += `<rect class="f-${w.league.id}" x="${x0.toFixed(1)}" y="${y(w.score).toFixed(1)}" width="${ww.toFixed(1)}" height="${(y(0) - y(w.score)).toFixed(1)}" rx="3"/><text x="${(x0 + ww / 2).toFixed(1)}" y="${(y(w.score) - 4).toFixed(1)}" text-anchor="middle">${w.score}</text>`;
    else wsvg += `<rect class="f-none" x="${x0.toFixed(1)}" y="${(y(0) - 2).toFixed(1)}" width="${ww.toFixed(1)}" height="2"/>`;
    wsvg += `<text x="${(x0 + ww / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${w.wk.slice(-3).replace('W', 'S')}</text>`;
  });
  wsvg += '</svg>';
  // tendance par axe : 10 derniers trajets contre les 10 d'avant
  const mean = (ts, k) => { const v = ts.map(t => t.sum.axes[k]).filter(has); return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null; };
  const A = trips.slice(0, 10), B = trips.slice(10, 20);
  const axes = AXES.map(([k, l]) => { const a = mean(A, k), b = mean(B, k), d = has(a) && has(b) ? a - b : null; return axisRow(l, a, has(d) ? `${d > 0 ? '▲ +' : d < 0 ? '▼ ' : '= '}${d} sur les 10 trajets d’avant` : '') }).join('');
  // records
  const best = trips.reduce((b, t) => !b || t.sum.score > b.sum.score ? t : b, null);
  const flow = trips.reduce((b, t) => Math.max(b, t.sum.streakBest || 0), 0);
  const wkSet = [...new Set(trips.map(t => PG.weekKey(t.ts)))].map(k => PG.weekStats(trips, k)).filter(w => w.n);
  const bestWk = wkSet.reduce((b, w) => !b || w.score > b.score ? w : b, null);
  const hs = PG.hotspots(trips).slice(0, 5);
  // trajets récurrents
  const groups = [], seen = new Set();
  for (const t of trips) { if (seen.has(t.id) || !t.from) continue; const g = [t, ...PG.sameRoute(trips, t).filter(x => !seen.has(x.id))]; if (g.length >= 2) { g.forEach(x => seen.add(x.id)); groups.push(g); } }
  const spark = (g) => { const v = g.slice().reverse().map(t => t.sum.score), w = 120, h = 30, x = i => 4 + (w - 8) * i / Math.max(1, v.length - 1), yy = s => 4 + (h - 8) * (1 - s / 100); return `<svg class="spark" viewBox="0 0 ${w} ${h}" style="width:${w}px" aria-hidden="true"><path class="ln" d="${v.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yy(s).toFixed(1)).join('')}"/><circle class="dt" cx="${x(v.length - 1).toFixed(1)}" cy="${yy(v[v.length - 1]).toFixed(1)}" r="3"/></svg>`; };
  $('#view-progress').innerHTML = `
    <div class="card"><div class="b-head">${ring(Math.round(lv.pct * 100), '', 'sm', 'xp').replace(/>\d+<\/b>/, `>${lv.level}</b>`).replace(/aria-label="Score \d+ sur 100"/, `aria-label="Niveau ${lv.level}"`)}<div class="b-meta"><p class="eyebrow">Niveau ${lv.level}</p><h2>${lv.title}</h2><p class="note">${billes(G.xp)} · encore ${fmt(lv.next - G.xp)} pour le niveau ${lv.level + 1}</p></div></div>
      <p class="note">Les billes se gagnent à la qualité : rien sous 40, et la distance ne compte que jusqu’à 20 km. Rouler plus ne sert à rien, rouler mieux, si.</p></div>
    <div class="card"><div class="h3row"><h3>Ta ligue</h3>${lgChip(weeks[7].league, weeks[7].score)}</div>
      <div class="ladder">${PG.LEAGUES.slice().reverse().map(([min, name, id]) => `<div class="${weeks[7].league && weeks[7].league.id === id ? 'on' : ''}">${marble(id)}${name}<small>${min ? min + '+' : '< 60'}</small></div>`).join('')}</div>

/* ---------- Cockpit : le bol et sa bille, jauge verticale, barre de direction ---------- */
function drawCockpit(canvas, e, ready) {
  const W = canvas.clientWidth; if (!W) return;
  const H = Math.round(W * 0.9), dpr = window.devicePixelRatio || 1, pw = Math.round(W * dpr), ph = Math.round(H * dpr);
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  const ctx = canvas.getContext('2d'); if (!ctx) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim(), CF = PL.CFG;
  const TAU = 2 * Math.PI, top = 20, barH = 50, labB = 16, area = H - top - barH - labB;
  const R = Math.min(area / 2, W * 0.36), cx = W - R - 4, cy = top + area / 2, MAX = 6, sc = R / MAX;
  const ring = (r, style, w, dash) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.strokeStyle = style; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); };
  ctx.font = '600 11px ' + col('--font-body'); ctx.textAlign = 'center';

  // Le bol : bord à 6 m/s², repères à 2 et 4, seuils modéré et sévère en pointillés.
  const bowl = ctx.createRadialGradient(cx, cy - R * 0.15, R * 0.1, cx, cy, R);
  bowl.addColorStop(0, col('--bowl-in')); bowl.addColorStop(1, col('--bowl-out'));
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = bowl; ctx.fill();
  ring(R, col('--line'), 1.5); ring(2 * sc, col('--line'), 1); ring(4 * sc, col('--line'), 1);
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R);
  ctx.strokeStyle = col('--line'); ctx.lineWidth = 1; ctx.setLineDash([]); ctx.stroke();
  ring(CF.ring.warn * sc, col('--warn'), 1.5, [5, 4]); ring(CF.ring.bad * sc, col('--bad'), 1.5, [5, 4]);
  ctx.fillStyle = col('--muted');
  ctx.fillText('AVANT', cx, 14); ctx.fillText('ARRIÈRE', cx, cy + R + 14);
  // Le point est la force ressentie : freinage → avant (haut), accélération → arrière (bas), virage → côté extérieur.
  const pos = p => { const m = Math.hypot(p[0], p[1]), k = m > MAX ? MAX / m : 1; return [cx + p[0] * k * sc, cy + p[1] * k * sc]; };
  // Sillage de la bille : ses dernières positions, de plus en plus pâles.
  const tr = e.trail; ctx.fillStyle = col('--brand'); ctx.setLineDash([]);
  for (let i = 0; i < tr.length; i += 2) { const a = pos(tr[i]); ctx.globalAlpha = i / tr.length * 0.35; ctx.beginPath(); ctx.arc(a[0], a[1], 3 + 5 * i / tr.length, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!ready) {
    ring(Math.min(MAX, e.liveMag) * sc, col('--brand'), 2, [3, 4]);
    ctx.fillStyle = col('--muted'); ctx.font = '12px ' + col('--font-body'); ctx.fillText('Accélère doucement', cx, cy + R * 0.55);
  }
  // La bille : bleue au calme, orange quand elle s'écarte, rouge quand un événement est compté.
  const p = pos([e.dLat, e.dLong]), mag = Math.hypot(e.dLat, e.dLong);
  const hot = e.dLong >= CF.accel.mod || -e.dLong >= CF.brake.mod || Math.abs(e.dLat) >= CF.corner.mod;
  const base = hot ? col('--bad') : mag >= 1.5 ? col('--pop') : col('--brand'), mr = Math.max(9, R * 0.085);
  ctx.globalAlpha = 0.22; ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.ellipse(p[0] + mr * 0.25, p[1] + mr * 0.75, mr * 0.95, mr * 0.38, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(p[0] - mr * 0.35, p[1] - mr * 0.4, mr * 0.08, p[0], p[1], mr);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.22, base); g.addColorStop(1, base);
  ctx.beginPath(); ctx.arc(p[0], p[1], mr, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.globalAlpha = 0.25; ctx.strokeStyle = '#000000'; ctx.lineWidth = 1; ctx.stroke(); ctx.globalAlpha = 1;

  // Jauge verticale : roues gauches (G) et droites (D), échelle ±8 m/s², haut = poussée vers le haut.
  const gx0 = 4, gx1 = cx - R - 16, gw = gx1 - gx0;
  if (gw >= 40) {
    const VMAX = 8, thr = Math.max(CF.shock.mod, CF.shock.noiseK * e.vNoise), gh = area / 2, ys = gh / VMAX, cw = Math.min(34, (gw - 14) / 2), gap = Math.min(14, gw - 2 * cw);
    const xs = [gx0 + (gw - 2 * cw - gap) / 2, gx0 + (gw - 2 * cw - gap) / 2 + cw + gap];
    ctx.fillStyle = col('--muted'); ctx.font = '600 11px ' + col('--font-body');
    ctx.fillText('VERTICAL', gx0 + gw / 2, 14);
    for (let i = 0; i < 2; i++) {
      const x = xs[i], v = Math.max(-VMAX, Math.min(VMAX, i ? e.zR : e.zL)), hotG = Math.abs(v) >= thr;
      ctx.fillStyle = col('--soft'); ctx.fillRect(x, cy - gh, cw, 2 * gh);
      ctx.fillStyle = hotG ? col('--bad') : col('--brand'); ctx.globalAlpha = hotG ? 1 : 0.85;
      ctx.fillRect(x, v >= 0 ? cy - v * ys : cy, cw, Math.abs(v) * ys); ctx.globalAlpha = 1;
      const pk = Math.min(VMAX, e.pk[i]);
      if (pk > 0.4) { ctx.fillStyle = col('--ink'); ctx.fillRect(x - 3, cy - pk * ys - 1, cw + 6, 2); ctx.fillRect(x - 3, cy + pk * ys - 1, cw + 6, 2); }
      ctx.fillStyle = col('--muted'); ctx.fillText(i ? 'D' : 'G', x + cw / 2, cy + gh + 14);
    }
    ctx.setLineDash([4, 3]); ctx.strokeStyle = col('--warn'); ctx.lineWidth = 1.5; ctx.beginPath();
    for (const d of thr < VMAX ? [thr, -thr] : []) { ctx.moveTo(gx0, cy - d * ys); ctx.lineTo(gx1, cy - d * ys); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = col('--ink'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(gx0, cy); ctx.lineTo(gx1, cy); ctx.stroke();
  }

  // Barre de direction : côté vers lequel la voiture tourne, très lissée ; elle prend la couleur de l'événement quand un coup de volant ou un redressement est compté.
  const bx = 4, bw = W - 8, by = H - 22, bh = 14, mid = bx + bw / 2;
  ctx.fillStyle = col('--muted'); ctx.font = '600 11px ' + col('--font-body'); ctx.textAlign = 'center';
  ctx.fillText('DIRECTION', mid, by - 9);
  ctx.fillStyle = col('--soft'); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 7) : ctx.rect(bx, by, bw, bh); ctx.fill();
  if (e.gyroOn) {
    const y = e.yawShow, v = Math.sign(y) * Math.min(1, Math.abs(y) / 20);
    const le = e.lastEvent, lit = le && (le.kind === 'swerve' || le.kind === 'fix') && e.t - le.t < 3;
    ctx.fillStyle = lit ? col(le.kind === 'swerve' ? '--k-swerve' : '--k-fix') : col('--brand'); ctx.fillRect(v >= 0 ? mid : mid + v * bw / 2, by + 2, Math.abs(v) * bw / 2, bh - 4);
    ctx.strokeStyle = col('--line'); ctx.lineWidth = 1;
    for (const k of [-1, 1]) for (const d of [5, 10, 15]) { const xx = mid + k * d / 20 * bw / 2; ctx.beginPath(); ctx.moveTo(xx, by + 1); ctx.lineTo(xx, by + bh - 1); ctx.stroke(); }
    ctx.strokeStyle = col('--ink'); ctx.beginPath(); ctx.moveTo(mid, by - 2); ctx.lineTo(mid, by + bh + 2); ctx.stroke();
    ctx.fillStyle = col('--muted'); ctx.textAlign = 'left'; ctx.fillText('G', bx + 2, by - 9); ctx.textAlign = 'right'; ctx.fillText('D', bx + bw - 2, by - 9);
  } else if (e.t > 3) { ctx.fillStyle = col('--muted'); ctx.font = '12px ' + col('--font-body'); ctx.fillText('Gyroscope indisponible', mid, by + 11); }
}



/* ---------- Direct ---------- */
const SAY = { brake: 'Freinage brusque', accel: 'Accélération vive', corner: 'Virage serré', swerve: 'Coup de volant', fix: 'Redressement', shift: 'Passage de vitesse brusque', phone: 'Téléphone en main. Concentre-toi sur la route.' };
function say(text, urgent) {
  if (!SET.voice || !('speechSynthesis' in window)) return;
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'fr-FR'; u.rate = 1.05; if (urgent) speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function sayEvent(e) {
  if (e.kind === 'speed') return say(`Attention, limite ${e.lim}.`, true);
  if (e.kind === 'shock') { if (e.fast) say('Dos d’âne trop vite.', true); return; }
  if (e.kind === 'brake' && e.late) return say('Freinage tardif. Anticipe.', true);
  if (SAY[e.kind]) say(SAY[e.kind], true);
}

function updateLive() {
  const r = S.run; if (!r || !$('#l-score')) return;
  const e = r.engine, s = e.summary(), C = 2 * Math.PI * 56, ready = e.status === 'ready', now = performance.now();
  $('#l-score').textContent = s.score;
  const rg = $('#l-score-ring'); rg.setAttribute('stroke-dashoffset', (C * (1 - s.score / 100)).toFixed(1)); rg.setAttribute('class', 'pg rc-' + tone(s.score));
  const kmh = (e.speed || 0) * 3.6;
  $('#l-speed').textContent = fmt(kmh);
  $('#l-line').textContent = `${fmt(s.km, 1)} km · ${clock(s.durationS)}`;
  $('#l-streak').textContent = clock(e.streak).replace(/^0/, '');
  // limitation
  const sg = $('#l-sign'); sg.hidden = !SET.limits;
  if (SET.limits) { sg.textContent = r.lim || '?'; sg.className = 'sign' + (r.lim ? '' : ' unk'); sg.setAttribute('aria-label', r.lim ? `Limitation ${r.lim} km/h` : 'Limitation inconnue'); }
  $('#l-speedw').className = 'speed' + (r.lim && kmh > r.lim + Math.max(5, r.lim * 0.05) ? ' over' : '');
  const st = $('#l-status');
  st.className = 'status' + (ready ? ' ok' : '');
  st.lastElementChild.textContent = e.status === 'init' ? 'Mesure…' : ready ? (r.gpsWarn ? 'Calé · GPS faible' : 'Calé') : e.recalCount ? 'Recalage : accélère en ligne droite' : 'Calage : accélère en ligne droite';
  const pause = now - r.lastMotion > 2500, bn = $('#l-banner');
  bn.hidden = !pause; if (pause) bn.textContent = 'Capteurs en pause : garde l’écran allumé et l’appli au premier plan.';
  // fatigue : pause recommandée toutes les 2 h ; un arrêt de 10 min remet le compteur à zéro
  const dt = r.lastTick ? Math.min(5, (now - r.lastTick) / 1000) : 0; r.lastTick = now;
  if (kmh > 3) { r.driveS += dt; r.stopS = 0; } else { r.stopS += dt; if (r.stopS >= 600) { r.driveS = 0; r.fatigueAt = 7200; } }
  if (r.driveS >= r.fatigueAt) { r.fatigueAt += 1800; say('Deux heures de route. Fais une pause d’au moins un quart d’heure.', true); }
  const fb = $('#l-fatigue'); fb.hidden = r.driveS < 7200; if (!fb.hidden) fb.textContent = `${clock(r.driveS).replace(/:\d\d$/, '')} de route sans pause : arrête-toi 15 minutes dès que possible.`;
  for (const [k] of AXES) { const row = $('#ax-' + k), v = s.axes[k]; row.querySelector('i').style.width = (has(v) ? v : 0) + '%'; row.querySelector('i').className = 'g-' + (has(v) ? tone(v) : 'none'); row.querySelector('.v').textContent = has(v) ? v : '—'; }

    ${sh.first ? `<div class="concept">${bowlSVG('wb')}<p>Imagine une bille dans un bol sur ton tableau de bord. Freine fort, elle file. Conduis en douceur, elle reste au centre. Plus elle reste au centre, plus tu gagnes de billes.</p></div><p class="note" style="margin:0">Choisis un pseudo et un avatar : c’est tout ce que voit ta bande.</p>` : ''}
    <div class="field"><label for="pf-name">Pseudo</label><input id="pf-name" maxlength="24" autocomplete="nickname" value="${esc(P.n)}" placeholder="Ton prénom"></div>
    <div class="field"><span class="lbl">Avatar</span><div class="avs">${PG.AVATARS.map(a => `<button data-act="pick-av" data-av="${a}" aria-pressed="${(sh.av || P.a) === a}" aria-label="Avatar ${a}">${a}</button>`).join('')}</div></div>
    <button class="btn" data-act="profile-save">${sh.first ? 'C’est parti' : 'Enregistrer'}</button>
    ${sh.first ? '<button class="btn link" data-act="sheet-close">Plus tard</button>' : ''}`;
  if (sh.type === 'share') return `${x}<h2>${{ defi: 'Envoyer le défi', kudos: 'Envoyer le bravo' }[sh.kind] || 'Partager ta carte'}</h2>
    ${sh.kind === 'kudos' ? '' : sh.img ? `<img class="preview" src="${sh.img}" alt="Carte de partage : ${esc(sh.text)}">` : '<p class="note" style="margin:0">Préparation de l’image…</p>'}
    <button class="btn" data-act="share-send">Envoyer</button>
    <button class="btn ghost" data-act="share-copy" style="width:100%">Copier le lien</button>
    <div class="linkbox" id="share-link">${esc(sh.text)} ${esc(sh.url)}</div>
    <p class="note" style="margin:0">Le lien contient ton pseudo, ton niveau et tes scores. Jamais tes trajets ni tes positions.</p>`;
  if (sh.type === 'defi-new') {
    const last = trips[0] ? trips[0].sum.score : null, wk = PG.weekStats(trips, PG.weekKey(now)).score;
    const ts = [...new Set([last, wk, 75, 80, 85, 90].filter(v => has(v) && v >= 50 && v <= 98))].sort((a, b) => a - b);
    if (!ts.includes(S.defi.target)) S.defi.target = ts.includes(80) ? 80 : ts[0];
    return `${x}<h2>Lancer un défi</h2><p class="note" style="margin:0">Ton ami doit faire mieux sur un seul trajet, avant la fin de la semaine prochaine.</p>
      <div class="field"><span class="lbl">Score à battre</span><div class="opts">${ts.map(v => `<button data-act="defi-opt" data-k="target" data-v="${v}" aria-pressed="${S.defi.target === v}">${v}${v === last ? ' · ton dernier' : v === wk ? ' · ta semaine' : ''}</button>`).join('')}</div></div>
      <div class="field"><span class="lbl">Distance minimale</span><div class="opts">${[3, 5, 10, 20].map(v => `<button data-act="defi-opt" data-k="km" data-v="${v}" aria-pressed="${S.defi.km === v}">${v} km</button>`).join('')}</div></div>
      <button class="btn" data-act="defi-create">Créer et envoyer</button>`;
  }
  if (sh.type === 'badge') {
    const b = PG.badge(sh.id), got = G.badges[sh.id];
    return `${x}<div class="b-head">${medal(sh.id, !got, false)}<div class="b-meta"><h2>${esc(b.name)}</h2><p class="note" style="margin:4px 0 0">${esc(b.desc)}</p><p class="eyebrow" style="margin-top:6px">${got ? 'Gagnée le ' + dayShort(got) : 'À gagner · 50 billes'}</p></div></div>`;
  }
  if (sh.type === 'friend') {
    const f = G.friends[sh.id]; if (!f) return x + '<p class="empty">Ami introuvable.</p>';
    const wk = PG.weekKey(now), lg = f.w === wk ? PG.league(f.ws) : null;
    return `${x}<div class="hello">${avatar(f.a, 'big')}<div><b>${esc(f.n)}</b><small>Niveau ${f.lv} · ${rares(f.b || 0)} · série ${f.st || 0}</small><div style="margin-top:6px">${lgChip(lg, f.w === wk ? f.ws : null)}</div></div></div>
      <p class="note" style="margin:0">Dernier trajet : <b>${has(f.s) ? f.s : '—'}</b>${f.km ? ` sur ${fmt(f.km, 1)} km` : ''}${f.ts ? ' · ' + ago(f.ts) : ''}. Carte reçue ${ago(f.got || now)}.</p>
      ${f.top && f.top.length ? `<div class="medals" style="justify-content:flex-start">${f.top.map(id => medal(id)).join('')}</div>` : ''}
      <div class="field"><span class="lbl">Envoyer un bravo</span><div class="opts">${['👏', '🔥', '💪', '🎉', '😎'].map(e => `<button data-act="kudos-send" data-id="${esc(f.id)}" data-e="${e}" aria-label="Bravo ${e}">${e}</button>`).join('')}</div></div>
      <div class="row"><button class="btn grow" data-act="defi-new" data-score="${has(f.s) ? Math.min(95, f.s + 1) : 80}">Défier ${esc(f.n)}</button><button class="btn ghost" data-act="friend-del" data-id="${esc(f.id)}">${S.confirm === 'fdel' + f.id ? 'Confirmer' : 'Retirer'}</button></div>`;
  }
  if (sh.type === 'incoming') {
    const { msg, res } = sh;
    if (!res) return x + '<h2>Lien illisible</h2><p class="note" style="margin:0">Ce lien Bille est incomplet ou abîmé. Demande à ton ami de le renvoyer.</p>';
    if (res.self) return x + '<h2>C’est ta propre carte</h2><p class="note" style="margin:0">Envoie-la à tes amis : quand ils l’ouvrent, tu apparais dans leur classement.</p>';
    const needName = !P.set ? `<p class="note" style="margin:0">Choisis d’abord ton pseudo pour répondre.</p><button class="btn ghost" data-act="profile" style="width:100%">Choisir mon pseudo</button>` : '';
    if (msg.k === 'c') {
      const f = res.friend, ans = res.defi && res.defi.answer;
      return `${x}<div class="hello">${avatar(f.a, 'big')}<div><b>${esc(f.n)}</b><small>${ans ? 'a relevé ton défi' : res.isNew ? 'rejoint ta bande' : 'a mis sa carte à jour'} · niveau ${f.lv}</small></div></div>
        ${ans ? `<p class="lvup" style="margin:0">${esc(f.n)} a fait ${ans.s} (défi : plus de ${res.defi.target}).</p>` : ''}
        <p class="note" style="margin:0">Dernier trajet : <b>${has(f.s) ? f.s : '—'}</b> · semaine : <b>${has(f.ws) ? f.ws : '—'}</b>${res.stale ? ' (tu avais déjà plus récent)' : ''}.</p>
        ${(res.badges || []).length ? `<div class="medals">${res.badges.map(id => medal(id)).join('')}</div>` : ''}
        ${needName}
        <button class="btn" data-act="share-card">Envoyer ma carte en retour</button>
        <button class="btn ghost" data-act="tab" data-tab="friends" style="width:100%">Voir le classement</button>`;
    }
    if (msg.k === 'd') {
      const d = res.defi;
      return `${x}<div class="hello">${avatar(d.from.a, 'big')}<div><b>${esc(d.from.n)} te défie</b><small>avant ${dayShort(d.until)}</small></div></div>
        <p class="lvup" style="margin:0">Fais plus de ${d.target} sur un trajet d’au moins ${d.km} km. 100 billes si tu gagnes.</p>
        ${d.status === 'expired' ? '<p class="note" style="margin:0">Ce défi est déjà expiré.</p>' : ''}
        ${needName}
        <button class="btn" data-act="tab" data-tab="drive">Relever le défi</button>`;
    }
    if (res.notMe) return `${x}<h2>Bravo pour quelqu’un d’autre</h2><p class="note" style="margin:0">Ce message de ${esc(msg.from.n)} était destiné à un autre ami.</p>`;
    return `${x}<div class="hello">${avatar(msg.from.a, 'big')}<div><b>${esc(msg.from.n)} t’applaudit ${esc(msg.e)}</b><small>${has(msg.s) ? 'pour ton ' + msg.s : ''}</small></div></div><button class="btn" data-act="sheet-close">Merci</button>`;
  }
  return '';
}
function renderSheet() {
  const el = $('#sheet');
  if (!S.sheet) { el.innerHTML = ''; return; }
  const keep = document.activeElement && document.activeElement.id === 'pf-name' ? $('#pf-name').value : null;
  el.innerHTML = `<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in">${sheetHTML()}</div></div></div>`;
  if (keep !== null && $('#pf-name')) $('#pf-name').value = keep;
}

/* ---------- Liens reçus ---------- */
function handleHash() {
  const h = location.hash; if (!h || h.length < 4 || !/^#[cdk]=/.test(h)) return;
  const msg = PG.decode(h);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  const res = msg ? PG.receive(G, msg, me(), Date.now()) : null; save(K.game, G);
  S.sheet = { type: 'incoming', msg, res }; render();
}

/* ---------- Rendu ---------- */
function navDot() {
  const n = G.feed.filter(f => f.type !== 'trip' && f.ts > (G.lastFriendsView || 0)).length, d = $('#nav-dot');
  d.hidden = !n || S.tab === 'friends'; d.textContent = n > 9 ? '9+' : n;
}
function render() {
  const driving = !!S.run; if (driving) S.tab = 'drive';
  $('#app').classList.toggle('driving', driving); $('#nav').hidden = driving;
  for (const k of ['drive', 'progress', 'friends', 'trips']) $('#view-' + k).hidden = S.tab !== k;
  for (const b of document.querySelectorAll('.nav [data-tab]')) b.setAttribute('aria-selected', String(b.dataset.tab === S.tab));
  renderTop();
  if (S.tab === 'drive') renderDrive(); else if (S.tab === 'progress') renderProgress(); else if (S.tab === 'friends') renderFriends(); else renderTrips();
  renderSheet(); navDot();
}

/* ---------- Actions ---------- */
document.addEventListener('click', ev => {
  const tb = ev.target.closest('.nav [data-tab]');
  if (tb) { S.tab = tb.dataset.tab; S.confirm = ''; S.opened = S.tab === 'trips' ? S.opened : null; window.scrollTo && window.scrollTo(0, 0); return render(); }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'sheet-bg') { if (ev.target === b && !(S.sheet && S.sheet.first)) { S.sheet = null; renderSheet(); } return; }
  switch (act) {
    case 'go': S.error = ''; say('C’est parti. Garde la bille au centre.'); startSensors(); break;
    case 'stop': finishRun(); break;
    case 'recal': if (S.run) { S.run.engine.recalibrate(); updateLive(); } break;
    case 'tg': SET[b.dataset.key] = !SET[b.dataset.key]; save(K.set, SET); b.setAttribute('aria-pressed', String(SET[b.dataset.key])); if (b.dataset.key === 'voice' && SET.voice) say('Coach vocal activé.'); break;
    case 'tab': S.tab = b.dataset.tab; S.sheet = null; S.opened = null; window.scrollTo && window.scrollTo(0, 0); render(); break;
    case 'cele-close': S.cele = null; render(); break;
    case 'open': S.tab = 'trips'; S.opened = id; S.confirm = ''; S.sheet = null; window.scrollTo && window.scrollTo(0, 0); render(); break;
    case 'back': S.opened = null; S.confirm = ''; render(); break;
    case 'del':
      if (S.confirm !== 'del' + id) { S.confirm = 'del' + id; return render(); }
      trips = trips.filter(t => t.id !== id); saveAll(); S.opened = null; S.confirm = ''; if (S.cele && S.cele.id === id) S.cele = null; render(); break;
    case 'clear':
      if (S.confirm !== 'clear') { S.confirm = 'clear'; return render(); }
      trips = []; saveAll(); S.confirm = ''; S.cele = null; render(); break;
    case 'profile': S.sheet = { type: 'profile', first: false }; renderSheet(); setTimeout(() => { const i = $('#pf-name'); if (i) i.focus(); }, 50); break;
    case 'pick-av': S.sheet.av = b.dataset.av; renderSheet(); break;
    case 'profile-save': {
      const n = ($('#pf-name').value || '').replace(/[<>]/g, '').trim().slice(0, 24);
      P = { ...P, n, a: S.sheet.av || P.a, set: !!n }; save(K.prof, P); S.sheet = null; render(); snack(n ? 'Profil enregistré' : 'Sans pseudo, tu apparais comme « Moi »'); break;
    }
    case 'sheet-close': S.sheet = null; S.confirm = ''; renderSheet(); break;
    case 'badge': S.sheet = { type: 'badge', id }; renderSheet(); break;
    case 'friend': S.sheet = { type: 'friend', id }; S.confirm = ''; renderSheet(); break;
    case 'friend-del':
      if (S.confirm !== 'fdel' + id) { S.confirm = 'fdel' + id; return renderSheet(); }
      delete G.friends[id]; save(K.game, G); S.sheet = null; S.confirm = ''; render(); break;
    case 'share-card': shareCard(); break;
    case 'share-trip': { const t = trips.find(x => x.id === id); shareCard(null, t); break; }
    case 'share-send': doShare(); break;
    case 'share-copy': copyLink(); break;
    case 'defi-new': S.defi.target = Math.max(50, Math.min(95, +b.dataset.score || 80)); S.sheet = { type: 'defi-new' }; renderSheet(); break;
    case 'defi-opt': S.defi[b.dataset.k] = +b.dataset.v; renderSheet(); break;
    case 'defi-create': { const nd = PG.newDefi(me(), S.defi.target, S.defi.km, Date.now()); G.defis.unshift(nd.local); save(K.game, G); shareDefi(nd.local); break; }
    case 'defi-resend': { const d = G.defis.find(x => x.id === id); if (d) shareDefi(d); break; }
    case 'defi-reply': shareCard(id); break;
    case 'kudos': S.sheet = { type: 'friend', id }; renderSheet(); break;
    case 'kudos-send': {
      const f = G.friends[id]; if (!f) break;
      const url = APP_URL + '#' + PG.encode('k', { from: me(), to: f.id, e: b.dataset.e, re: f.ts, s: f.s });
      S.sheet = { type: 'share', kind: 'kudos', url, text: `${b.dataset.e} Bravo ${f.n}${has(f.s) ? ' pour ton ' + f.s : ''} !`, img: null, file: null };
      renderSheet(); break;
    }
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.sheet && !S.sheet.first) { S.sheet = null; renderSheet(); } });
window.addEventListener('hashchange', handleHash);
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!S.run) render(); }, 200); });

if (!P.set && !/^#[cdk]=/.test(location.hash)) S.sheet = { type: 'profile', first: true };
render();
handleHash();
})();

</script>
</body></html>
