<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0C1318"><title>Pied Léger</title><style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Une colonne mobile (560 px max) : onglets Conduite / Historique. Direct = cockpit, bilan = une fiche. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#13202B; --muted:#566676; --line:#D3DAE1; --soft:#E4E9EE;
  --accent:#0A6C88; --accent-ink:#FFFFFF;
  --good:#1C8A4B; --warn:#A96A12; --bad:#C23B32; --bad-ink:#FFFFFF;
  --k-brake:#C23B32; --k-accel:#B7791F; --k-corner:#4F5BD5; --k-swerve:#0E8F7E; --k-fix:#C2417B; --k-shift:#7A55E0; --k-shock:#5E6B78;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1318; --surface:#141D25; --ink:#E5ECF1; --muted:#8C9CAA; --line:#26333E; --soft:#1B2731;
  --accent:#43C1DD; --accent-ink:#06222B;
  --good:#4FCB86; --warn:#E3AE4D; --bad:#F0736B; --bad-ink:#2A0B08;
  --k-brake:#F0736B; --k-accel:#E3AE4D; --k-corner:#8C97FF; --k-swerve:#3CCDB8; --k-fix:#F07AAE; --k-shift:#A58BFF; --k-shock:#A7B3BF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1318; --surface:#141D25; --ink:#E5ECF1; --muted:#8C9CAA; --line:#26333E; --soft:#1B2731;
  --accent:#43C1DD; --accent-ink:#06222B;
  --good:#4FCB86; --warn:#E3AE4D; --bad:#F0736B; --bad-ink:#2A0B08;
  --k-brake:#F0736B; --k-accel:#E3AE4D; --k-corner:#8C97FF; --k-swerve:#3CCDB8; --k-fix:#F07AAE; --k-shift:#A58BFF; --k-shock:#A7B3BF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:14px}
.top h1{margin:0;font:700 28px/1 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 0;margin-bottom:-1px;font:500 15px var(--font-body);color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
h2{margin:0;font:600 26px/1.1 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{margin:0 0 10px;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl{display:block;margin:14px 0 6px;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl:first-child{margin-top:0}
.hint{margin:6px 0 0;color:var(--muted);font-size:13px}
.btn{display:block;width:100%;padding:14px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--font-body);text-align:center;cursor:pointer}
.btn.big{padding:18px 16px;font-size:18px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--ink);padding:10px 14px;font-size:14px;width:auto;display:inline-block}
.btn.stop{background:var(--bad);color:var(--bad-ink)}
.btn.link{background:none;color:var(--muted);padding:8px 0;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;width:auto;display:inline-block}
.err{margin-top:14px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;background:var(--soft);font-size:14px}
.note{margin:12px 0 0;color:var(--muted);font-size:13px}
.go{margin-top:16px}
.row{display:flex;gap:10px}.row .btn.stop{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.chips:empty{display:none}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px 4px 8px;border-radius:99px;background:var(--soft);font-size:13px}
.chip b{font:600 13px var(--font-data);font-variant-numeric:tabular-nums}
.banner{margin:10px 0 0;padding:9px 12px;border:1px solid var(--warn);border-radius:10px;background:var(--soft);font-size:14px}

/* score */
.b-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--s:132px;position:relative;width:var(--s);height:var(--s);flex:none}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{stroke:var(--soft)}
.ring .pg{transition:stroke-dashoffset .25s}
.rc-good{stroke:var(--good)} .rc-warn{stroke:var(--warn)} .rc-bad{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 calc(var(--s) * .45)/1 var(--font-display);font-variant-numeric:tabular-nums}
.ring.sm{--s:92px}
.b-meta{flex:1;min-width:170px}
.eyebrow{margin:0 0 4px;color:var(--muted);font:400 12px var(--font-data)}
.delta{display:inline-block;margin-top:6px;font:500 13px var(--font-data)}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)} .delta.eq{color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 0}
.stats dt{font:600 11px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font:500 14px var(--font-data);font-variant-numeric:tabular-nums}
.sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.focus{display:flex;flex-direction:column;gap:8px}
.fo{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;background:var(--soft);border-radius:10px}
.fo .n{display:grid;place-items:center;height:36px;border-radius:8px;background:var(--surface);font:700 20px var(--font-display);font-variant-numeric:tabular-nums}
.fo b{display:block;font-weight:600}
.fo span{color:var(--muted);font-size:14px}
.fo.good{grid-template-columns:minmax(0,1fr)}

/* axes */
.axis{display:grid;grid-template-columns:minmax(92px,112px) 1fr 34px;grid-template-areas:"l b v" ". d d";align-items:center;column-gap:10px;padding:5px 0}
.axis>span:first-child{grid-area:l}
.axis .bar{grid-area:b;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.axis .bar i{display:block;height:100%;border-radius:4px;transition:width .2s}
.axis .v{grid-area:v;text-align:right;font:500 14px var(--font-data);font-variant-numeric:tabular-nums}
.axis small{grid-area:d;color:var(--muted);font-size:12px;margin-top:2px}
.live .axis{grid-template-areas:"l b v"}
.g-good{background:var(--good)} .g-warn{background:var(--warn)} .g-bad{background:var(--bad)}

/* événements */
.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev b{display:block;font-weight:600}
.ev small{color:var(--muted);font:400 12px var(--font-data)}
.ev time{color:var(--muted);font:400 12px var(--font-data);font-variant-numeric:tabular-nums}
.sev{padding:2px 7px;border:1px solid;border-radius:99px;font:600 11px var(--font-body);letter-spacing:.06em;text-transform:uppercase}
.sev1{color:var(--warn)} .sev2{color:var(--bad)} .sev0{color:var(--muted)}
.mk{display:inline-block;width:12px;height:12px;justify-self:center;flex:none}
.mk.brake{background:var(--k-brake);border-radius:50%}
.mk.accel{background:var(--k-accel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk.corner{background:var(--k-corner);transform:rotate(45deg) scale(.78)}
.mk.swerve{background:var(--k-swerve);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.mk.fix{background:var(--k-fix);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)}
.mk.shift{background:var(--k-shift);border-radius:3px;transform:scale(.8)}
.mk.shock{border:2px solid var(--k-shock);border-radius:2px;width:11px;height:11px}
.empty{margin:0;color:var(--muted)}
.more{margin-top:6px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* graphiques */
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:400 11px var(--font-data);fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .m{stroke:var(--surface);stroke-width:1.5}
.chart .m-brake{fill:var(--k-brake)} .chart .m-accel{fill:var(--k-accel)} .chart .m-corner{fill:var(--k-corner)}
.chart .m-swerve{fill:var(--k-swerve)} .chart .m-fix{fill:var(--k-fix)} .chart .m-shift{fill:var(--k-shift)}
.chart .m-shock{fill:var(--surface);stroke:var(--k-shock);stroke-width:2}

/* direct : cockpit */
.live{padding:14px}
.l-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.status{display:inline-flex;gap:8px;align-items:center;padding:4px 11px;border-radius:99px;background:var(--soft);font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.ok i{background:var(--good)}
.trip-line{font:400 13px var(--font-data);color:var(--muted)}
.l-hero{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-top:12px}
.speed{font:700 56px/1 var(--font-display);font-variant-numeric:tabular-nums;text-align:center}
.speed small{font:500 14px var(--font-data);color:var(--muted);margin-left:4px}
.streak{text-align:right}
.streak b{display:block;font:700 30px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--good)}
.streak small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.gg{display:block;width:100%;max-width:460px;aspect-ratio:10/9;margin:10px auto 6px}
.toast{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:60px;padding:10px 14px;border:1px solid var(--line);border-left:5px solid var(--good);border-radius:10px;background:var(--soft)}
.toast.w{border-left-color:var(--warn)} .toast.b{border-left-color:var(--bad)} .toast.i{border-left-color:var(--k-shock)}
.toast b{display:block;font:600 17px/1.2 var(--font-body)}
.toast small{color:var(--muted);font:400 12px var(--font-data)}
.toast .pts{font:700 26px/1 var(--font-display);font-variant-numeric:tabular-nums;color:var(--bad)}
.toast.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.03)}to{transform:none}}

/* historique */
.trips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trips li{border-top:1px solid var(--line)}
.trips li:first-child{border-top:0}
.trip{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.badge{display:grid;place-items:center;height:46px;border:2px solid;border-radius:10px;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.bd-good{color:var(--good)} .bd-warn{color:var(--warn)} .bd-bad{color:var(--bad)}
.trip b{display:block;font-weight:600}
.trip small{color:var(--muted);font:400 12px var(--font-data)}
.chev{color:var(--muted);font-size:20px}
.back{align-self:flex-start;padding:4px 0}
.spark{display:block;width:100%;height:auto;overflow:visible}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.spark .dt{fill:var(--accent)}
.spark text{font:400 11px var(--font-data);fill:var(--muted)}
.spark .gl{stroke:var(--line)}

@media (prefers-reduced-motion: reduce){.ring .pg,.axis .bar i{transition:none}.toast.pop{animation:none}}
</style>

<main class="app" id="app">
  <header class="top"><h1>Pied Léger</h1></header>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-drive" data-tab="drive" aria-selected="true">Conduite</button>
    <button role="tab" id="tab-history" data-tab="history" aria-selected="false">Historique</button>
  </nav>
  <section id="view-drive" class="stack" aria-labelledby="tab-drive"></section>
  <section id="view-history" class="stack" aria-labelledby="tab-history" hidden></section>
</main>

<script>
/* Pied Léger — moteur d'analyse de conduite (pur, sans DOM). v2 : exigeant, gyroscope, volant, passages de vitesse. */
const PL = (() => {
  'use strict';
  const G = 9.81, D2R = Math.PI / 180;
  const CFG = {
    // Seuils d'événements (m/s²). La télématique signale le freinage brusque dès 0,3 g et considère < 0,2 g normal :
    // on est volontairement plus strict (0,25 g / 0,2 g / 0,25 g).
    brake:  { mod: 2.5, sev: 4.0 },
    accel:  { mod: 2.0, sev: 3.2 },
    corner: { mod: 2.5, sev: 4.0 },
    ring:   { warn: 2.5, bad: 4.0 },   // repères du disque en direct
    shock:  { mod: 2.5, sev: 5, noiseK: 6 },   // choc vertical (nid-de-poule, dos-d'âne) ; seuil = max(mod, noiseK × bruit de fond)
    bump:   { fastKmh: 30, peak: 4 },
    shockRefractory: 1.0, minShockSpeed: 3, shockHz: 12,
    rollGain: 2.5, rollHz: 6, sideRatio: 0.15,
    lateLead: -0.5,                    // freinage « tardif » : on ne décélérait pas déjà 1,2 à 4 s avant
    minEventS: 0.3, minCornerSpeed: 3, stopSpeed: 0.5, movingSpeed: 1,
    smoothHz: 3, fastHz: 4, hysteresis: 0.7,   // lissage : 3 filtres de 3 Hz (≈ 1,5 Hz) pour l'affichage ET la détection ; 4 Hz (2 filtres) pour volant et vitesses
    gaugeDead: 0.7, gaugeDecay: 0.35,
    // Coup de volant : aller-retour latéral rapide (≥ 1,3 m/s² de chaque côté en moins de 2,2 s).
    swerve: { amp: 1.3, minSpeed: 8, maxGap: 2.2, jerkMod: 2.6, jerkSev: 6 },
    // Redressement : dérive lente (≥ 0,35 °/s) puis correction vive en sens inverse (≥ 5 °/s, < 1,6 s) : inattention.
    fix: { spike: 5, sev: 9, quiet: 2.6, drift: 0.3, agree: 0.7, minSpeed: 8, end: 2.5, maxDur: 1.6 },
    // Passage de vitesse : creux d'accélération en phase d'accélération (rupture de couple), puis reprise.
    shift: { minDepth: 0.8, preMin: 0.7, open: 0.4, recover: 0.3, maxFall: 1.0, maxDip: 2.0, harsh: 1.0, sev: 1.9, slope: 5, slopeSev: 9, reb: 0.9 },
    minKm: 3,
    phaseMin: 0.8, phaseTime: 8,
    // Intensité : percentile 90 de l'effort quand on freine / accélère / tourne (100 sous a, 0 au-delà de b).
    inten: { brake: [1.6, 4.0], accel: [1.2, 2.8], corner: [1.5, 3.6] },
    jerk: [0.4, 1.5], steer: [0.5, 1.8]
  };
  // Pondération des axes ; le score final mélange la moyenne et le plus faible axe (un point noir pèse).
  const W = { freinage: .24, acceleration: .16, virages: .20, trajectoire: .20, fluidite: .20 };
  const AXIS_K = { freinage: 1.7, acceleration: 1.7, virages: 1.7, trajectoire: 1.3 };

  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const unit = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
  const madd = (a, s, b) => [a[0]+s*b[0], a[1]+s*b[1], a[2]+s*b[2]];
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const lin = (x, a, b) => clamp((b - x) / (b - a), 0, 1);   // 1 sous a, 0 au-delà de b
  const fin = x => x !== null && x !== undefined && Number.isFinite(x);
  const BIN = 0.1, NB = 81;

  class Engine {
    constructor(opts = {}) { this.mount = opts.mount === 'vent' ? 'vent' : 'free'; this.reset(); }

    reset() {
      this.t0 = null; this.tPrev = null; this.t = 0;
      this.g = null; this.gBuf = []; this.gCal = null;
      this.speed = null; this.fix = null; this.dist = 0;
      this.movingS = 0; this.maxV = 0; this.moveStart = null;
      this.basis = null; this.f = null;
      this.cal = { n: 0, sx: 0, sy: 0, den: 0 };
      this.hAcc = [0, 0]; this.hN = 0;
      this.sm = [0, 0, 0, 0, 0, 0];
      this.aLong = 0; this.aLat = 0;
      this.open = {}; this.events = []; this.evSeq = 0; this.lastEvent = null;
      this.series = []; this.nextSeriesT = 0;
      this.trail = []; this.nextTrailT = 0; this.hist = []; this.nextTickT = 0;
      this.vz = 0; this.shock = null; this.lastShock = -9;
      this.rs = 1; this.ventOk = false; this.fSource = null;
      this.vh = 0; this.vzSlow = 0; this.lz = 0; this.lzSlow = 0; this.zL = 0; this.zR = 0; this.pk = [0, 0]; this.vNoise = 0.3; this.latLearned = false; this.gapS = 0; this.lastMotionT = null;
      this.fxQ = null; this.shocks = 0;
      this.fd = [0, 0, 0, 0]; this.dLong = 0; this.dLat = 0; this.fLong = 0; this.fLat = 0; this.liveMag = 0;
      this.latSign = 1; this.latAcc = 0; this.latN = 0; this.latCal = { sum: 0, den: 0, n: 0 }; this.prevHead = null;
      this.tickT = null; this.prevA = [0, 0]; this.jerkSq = 0; this.jerkT = 0;
      this.recalCount = 0;
      // Gyroscope : cap de la voiture (lacet), volant, redressements
      this.gyroOn = false; this.bias = 0; this.ySign = 1; this.ySum = 0; this.yF = 0; this.yawSlow = 0; this.yaw = 0; this.yawD = 0; this.yS1 = 0; this.yS2 = 0; this.yawShow = 0;
      this.ybuf = []; this.fx = null; this.fxLast = -9;
      this.steerSq = 0; this.steerT = 0;
      // Segments latéraux (coups de volant), creux d'accélération (passages de vitesse)
      this.sg = null; this.sgPrev = null; this.mute = null; this.lastCurveT = -9;
      this.dip = null; this.shiftPend = null; this.shiftN = 0;
      // Histogrammes d'effort (pondérés par le temps) pour l'intensité du freinage, de l'accélération, des virages
      this.bins = { brake: new Float32Array(NB), accel: new Float32Array(NB), corner: new Float32Array(NB) };
      this.phaseT = { brake: 0, accel: 0, corner: 0 };
      this.lastBadT = 0; this.bestStreak = 0;
      this.status = 'init'; // init -> calibrating -> ready
    }

    /** Téléphone vertical sur la grille : l'avant du véhicule est derrière l'écran (−z), projeté à l'horizontale. */
    _applyPrior(u) {
      const z = [0, 0, 1], zh = madd(z, -dot(z, u), u), n = Math.hypot(zh[0], zh[1], zh[2]);
      if (n < 0.2) return false;
      this.f = [-zh[0] / n, -zh[1] / n, -zh[2] / n]; this.fSource = 'prior'; this.status = 'ready';
      return true;
    }

    _newBasis(u) {
      const a = Math.abs(u[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
      const e1 = unit(madd(a, -dot(a, u), u));
      this.basis = { u, e1, e2: cross(u, e1) };
      this.cal = { n: 0, sx: 0, sy: 0, den: 0 };
      this.hAcc = [0, 0]; this.hN = 0;
    }

    /** Oublie l'orientation : le calage se refait à la prochaine accélération en ligne droite. */
    recalibrate() {
      if (!this.g) return;
      this.f = null; this.fSource = null; this.basis = null; this.open = {}; this.sg = null; this.sgPrev = null; this.dip = null; this.fx = null;
      this.gCal = unit(this.g); this.status = 'calibrating'; this.recalCount++;
    }

    /** Accéléromètre gravité incluse (m/s²) ; gx, gy, gz : gyroscope (°/s, axes de l'appareil), facultatif. t en s. */
    pushMotion(t, ax, ay, az, gx, gy, gz) {
      if (this.t0 === null) this.t0 = t;
      const ts = t - this.t0;
      const dt = this.tPrev === null ? 0.02 : clamp(t - this.tPrev, 0.001, 0.2);
      if (this.tPrev !== null && t - this.tPrev > 0.5) this.gapS += t - this.tPrev;   // capteurs interrompus (écran verrouillé…)
      this.tPrev = t; this.t = ts;
      const r = [this.rs * ax, this.rs * ay, this.rs * az];

      // 1. Gravité : moyenne initiale, puis suivi lent (rapide à l'arrêt).
      if (!this.g) {
        this.gBuf.push(r);
        if (this.gBuf.length >= 25) {
          const s = [0, 0, 0];
          for (const v of this.gBuf) { s[0] += v[0]; s[1] += v[1]; s[2] += v[2]; }
          // Portrait, haut de l'écran vers le haut : la gravité mesurée est surtout selon y. Son signe donne la
          // convention du navigateur (Android : +, iOS : −) : on normalise tout pour avoir « haut = +gravité ».
          let rs = 1; this.ventOk = false;
          const m = Math.hypot(s[0], s[1], s[2]);
          if (this.mount === 'vent' && m > 0 && Math.abs(s[1]) / m >= 0.7) { rs = s[1] < 0 ? -1 : 1; this.ventOk = true; }
          this.rs = rs; this.g = [rs * s[0] / 25, rs * s[1] / 25, rs * s[2] / 25]; this.gBuf = null;
          this.gCal = unit(this.g); this.status = 'calibrating';
          this._newBasis(this.gCal);
          if (this.ventOk) this._applyPrior(this.gCal);
        }
        return;
      }
      // À l'arrêt, la gravité se met à jour vite, mais seulement si le téléphone est calme.
      const stopped = this.speed !== null && this.speed < CFG.stopSpeed;
      const dev = Math.hypot(r[0] - this.g[0], r[1] - this.g[1], r[2] - this.g[2]);
      let tau = 300;
      if (stopped) {
        if (dev <= 0.35) { this.devT = 0; tau = 1; }
        else { this.devT = (this.devT || 0) + dt; tau = this.devT > 2 ? 0.5 : Infinity; }
      } else this.devT = 0;
      const kg = tau === Infinity ? 0 : 1 - Math.exp(-dt / tau);
      for (let i = 0; i < 3; i++) this.g[i] += (r[i] - this.g[i]) * kg;
      const u = unit(this.g);

      // Téléphone déplacé : on oublie l'axe avant et on recalibre.
      if (this.f && dot(u, this.gCal) < 0.94) {
        this.f = null; this.fSource = null; this.basis = null; this.gCal = u; this.open = {}; this.sg = null; this.sgPrev = null; this.dip = null; this.fx = null;
        this.status = 'calibrating'; this.recalCount++;
        if (this.ventOk) this._applyPrior(u);
      }
      if (!this.basis || dot(u, this.basis.u) < 0.996) this._newBasis(u);

      // 2. Accélération linéaire et projection sur les axes du véhicule.
      const li = [r[0]-this.g[0], r[1]-this.g[1], r[2]-this.g[2]];
      if (this.basis) { this.hAcc[0] += dot(li, this.basis.e1); this.hAcc[1] += dot(li, this.basis.e2); this.hN++; }
      let aL = 0, aT = 0;
      if (this.f) {
        const fp = unit(madd(this.f, -dot(this.f, u), u));
        aL = dot(li, fp); aT = dot(li, cross(u, fp));
      }
      if (this.f) { this.latAcc += aT; this.latN++; }
      const aTs = aT * this.latSign;                 // + = le véhicule accélère vers la gauche
      // Signal « voiture » : 3 filtres en cascade. C'est LE signal affiché ET celui qui déclenche les événements :
      // ce que le conducteur voit en direct est exactement ce qui est enregistré. Les vibrations moteur disparaissent.
      const al = 1 - Math.exp(-2 * Math.PI * CFG.smoothHz * dt), M = this.sm;
      M[0] += al * (aL - M[0]); M[1] += al * (M[0] - M[1]); M[2] += al * (M[1] - M[2]);
      M[3] += al * (aTs - M[3]); M[4] += al * (M[3] - M[4]); M[5] += al * (M[4] - M[5]);
      this.aLong = this.dLong = M[2]; this.aLat = this.dLat = M[5];
      // Signal plus vif (2 filtres, 4 Hz) pour les gestes courts : coups de volant et passages de vitesse.
      const ad = 1 - Math.exp(-2 * Math.PI * CFG.fastHz * dt), D = this.fd;
      D[0] += ad * (aL - D[0]); D[1] += ad * (D[0] - D[1]);
      D[2] += ad * (aTs - D[2]); D[3] += ad * (D[2] - D[3]);
      this.fLong = D[1]; this.fLat = D[3];
      const hm = Math.sqrt(Math.max(0, dot(li, li) - dot(li, u) ** 2));
      this.liveMag += (hm - this.liveMag) * (1 - Math.exp(-dt / 0.3));

      // 3. Temps cumulés selon la vitesse GPS.
      const v = this.speed;
      if (v !== null) {
        const kmh = v * 3.6;
        if (v > CFG.movingSpeed) { this.movingS += dt; if (this.moveStart === null) { this.moveStart = ts; this.lastBadT = ts; } }
        if (kmh > this.maxV) this.maxV = kmh;
      }

      // 4. Gyroscope : vitesse de lacet (volant). Signe appris en comparant au latéral, biais estimé à l'arrêt.
      if (fin(gx) && fin(gy) && fin(gz)) {
        this.gyroOn = true;
        const yr = dot([gx * D2R, gy * D2R, gz * D2R], u);
        if (stopped) this.bias += (yr - this.bias) * (1 - Math.exp(-dt / 2));
        else if (v !== null && v > 8 && Math.abs(yr - this.bias) < 0.025) this.bias += (yr - this.bias) * (1 - Math.exp(-dt / 40));
        const y = yr - this.bias;
        if (this.f && v !== null && v > 4 && Math.abs(this.aLat) > 0.8) this.ySum += y * this.aLat * dt;
        this.ySign = this.ySum < 0 ? -1 : 1;
        const yc = this.ySign * y;                                  // + = la voiture tourne à gauche
        this.yF += (yc - this.yF) * (1 - Math.exp(-2 * Math.PI * 2.5 * dt));
        this.yawD += (yc - this.yawD) * (1 - Math.exp(-2 * Math.PI * 4 * dt));
        this.yaw = this.yawD / D2R;                                 // °/s, pour l'affichage
        this.yS1 += (yc - this.yS1) * (1 - Math.exp(-2 * Math.PI * 1.2 * dt)); this.yS2 += (this.yS1 - this.yS2) * (1 - Math.exp(-2 * Math.PI * 1.2 * dt));
        this.yawShow = Math.abs(this.yS2) / D2R < 1.5 ? 0 : this.yS2 / D2R;   // °/s, affichage seul : 1,2 Hz ×2 + zone morte
        this.yawSlow += (this.yF - this.yawSlow) * (1 - Math.exp(-dt / 3));
        if (Math.abs(this.aLat) >= 0.9) this.lastCurveT = ts;
        if (v !== null && v >= CFG.swerve.minSpeed && ts - this.lastCurveT > 2.5) {
          const hp = (this.yF - this.yawSlow) / D2R; this.steerSq += hp * hp * dt; this.steerT += dt;
        }
      }

      // 5. Chocs de chaussée : vertical et latéral peu filtrés (12 Hz), sans la composante lente.
      const ks = 1 - Math.exp(-2 * Math.PI * CFG.shockHz * dt);
      this.vz += (dot(li, u) - this.vz) * ks;
      this.vzSlow += (this.vz - this.vzSlow) * (1 - Math.exp(-dt / 1.5));
      this.vh = this.vz - this.vzSlow;
      this.lz += (aTs - this.lz) * (1 - Math.exp(-2 * Math.PI * CFG.rollHz * dt));
      this.lzSlow += (this.lz - this.lzSlow) * (1 - Math.exp(-dt / 0.8));
      const sR = -(this.lz - this.lzSlow);   // + : vers la droite
      // Jauge : zone morte (vibrations du moteur et du revêtement) puis retombée douce, pour lire les chocs et pas le bruit.
      const dz = x => Math.sign(x) * Math.max(0, Math.abs(x) - CFG.gaugeDead), dc = Math.exp(-dt / CFG.gaugeDecay);
      const zl = dz(0.5 * (this.vh + CFG.rollGain * sR)), zr = dz(0.5 * (this.vh - CFG.rollGain * sR));
      this.zL = Math.abs(zl) >= Math.abs(this.zL) ? zl : this.zL * dc; this.zR = Math.abs(zr) >= Math.abs(this.zR) ? zr : this.zR * dc;
      const dk = Math.exp(-dt / 2.5);
      this.pk[0] = Math.max(this.pk[0] * dk, Math.abs(this.zL)); this.pk[1] = Math.max(this.pk[1] * dk, Math.abs(this.zR));
      // Bruit de fond du revêtement : un choc doit nettement le dépasser (route pavée = seuil plus haut).
      if (!this.shock) this.vNoise += (Math.min(Math.abs(this.vh), 2) - this.vNoise) * (1 - Math.exp(-dt / 8));
      if (v !== null) this._shockCheck(this.vh, sR, v, ts);

      // 6. Événements de conduite.
      if (this.f && v !== null) {
        this._detect('brake', -this.aLong, v, ts);
        this._detect('accel', this.aLong, v, ts);
        if (v >= CFG.minCornerSpeed) this._detect('corner', Math.abs(this.aLat), v, ts);
        else this._close('corner', ts);
        this._swerve(this.fLat, v, ts);
        // Intensité : temps passé à chaque niveau d'effort quand on freine / accélère / tourne.
        const hp = CFG.phaseMin;
        if (v > 1.5 && -this.aLong >= hp) this._bin('brake', -this.aLong, dt);
        if (v > 1.5 && this.aLong >= hp) this._bin('accel', this.aLong, dt);
        if (v >= CFG.minCornerSpeed && Math.abs(this.aLat) >= hp) this._bin('corner', Math.abs(this.aLat), dt);
      }

      // 7. Séries et mémoire courte à 10 Hz ; fluidité (à-coups à 2 Hz).
      if (ts >= this.nextSeriesT) { this.series.push({ t: Math.round(ts), v: (v || 0) * 3.6 }); this.nextSeriesT = ts + 1; }
      if (ts >= this.nextTrailT) {
        this.trail.push([this.dLat, this.dLong]); if (this.trail.length > 40) this.trail.shift();
        this.hist.push([ts, this.aLong, this.fLong]); if (this.hist.length > 60) this.hist.shift();
        this.ybuf.push([ts, this.yF / D2R]); if (this.ybuf.length > 50) this.ybuf.shift();
        this.nextTrailT = ts + 0.1;
        if (this.f && v !== null) { this._tickShift(ts, v); this._tickFix(ts, v); }
      }
      if (this.tickT === null) { this.tickT = ts; this.prevA = [this.aLong, this.aLat]; }
      else if (ts - this.tickT >= 0.5) {
        const d = ts - this.tickT;
        if (this.f && v !== null && v > 2) {
          const jl = (this.aLong - this.prevA[0]) / d, jt = (this.aLat - this.prevA[1]) / d;
          this.jerkSq += (jl*jl + jt*jt) * d; this.jerkT += d;
        }
        this.tickT = ts; this.prevA = [this.aLong, this.aLat];
      }
    }

    /** Vitesse GPS (m/s). Sert aussi à trouver l'axe avant du véhicule. */
    pushFix(t, v, heading) {
      if (this.t0 === null) this.t0 = t;
      const ts = t - this.t0;
      if (this.fix) {
        const dtf = ts - this.fix.t;
        if (dtf > 0.2 && dtf < 5) {
          this.dist += (v + this.fix.v) / 2 * dtf;
          const a = (v - this.fix.v) / dtf;
          if (this.basis && this.hN > 0 && Math.abs(a) >= 0.4) {
            const hm = [this.hAcc[0] / this.hN, this.hAcc[1] / this.hN], c = this.cal;
            c.sx += hm[0] * a; c.sy += hm[1] * a; c.den += Math.hypot(hm[0], hm[1]) * Math.abs(a); c.n++;
            const m = Math.hypot(c.sx, c.sy);
            if (c.n >= 4 && c.den > 1 && m / c.den >= 0.75) {
              const b = this.basis;
              this.f = unit([
                (c.sx*b.e1[0] + c.sy*b.e2[0]) / m,
                (c.sx*b.e1[1] + c.sy*b.e2[1]) / m,
                (c.sx*b.e1[2] + c.sy*b.e2[2]) / m
              ]);
              this.fSource = 'gps'; this.status = 'ready';
            }
          }
        }
      }
      // Sens gauche/droite : certains navigateurs (iOS) inversent le signe des capteurs.
      if (heading != null && Number.isFinite(heading) && v > 3) {
        const ph = this.prevHead;
        if (ph && this.fix && Math.abs(ph.t - this.fix.t) < 1e-9) {
          const dtf = ts - ph.t;
          if (dtf > 0.2 && dtf < 5 && this.f && this.latN > 0) {
            const dh = ((heading - ph.h + 540) % 360) - 180;
            const aLeft = -(v + ph.v) / 2 * (dh * Math.PI / 180) / dtf;
            if (Math.abs(aLeft) >= 0.6) {
              const m = this.latAcc / this.latN, c = this.latCal;
              c.sum += m * aLeft; c.den += Math.abs(m * aLeft); c.n++;
              if (c.n >= 3 && Math.abs(c.sum) / c.den >= 0.6) { this.latSign = c.sum > 0 ? 1 : -1; this.latLearned = true; }
            }
          }
        }
        this.prevHead = { t: ts, h: heading, v };
      } else this.prevHead = null;
      this.fix = { t: ts, v }; this.speed = v; this.hAcc = [0, 0]; this.hN = 0; this.latAcc = 0; this.latN = 0;
    }

    _bin(k, x, dt) { this.bins[k][Math.min(NB - 1, Math.floor(x / BIN))] += dt; this.phaseT[k] += dt; }
    _p90(k) {
      const tot = this.phaseT[k]; if (tot < CFG.phaseTime) return null;
      let c = 0; const b = this.bins[k];
      for (let i = 0; i < NB; i++) { c += b[i]; if (c >= 0.9 * tot) return (i + 0.5) * BIN; }
      return NB * BIN;
    }
    _bad(ts) { this.bestStreak = Math.max(this.bestStreak, ts - this.lastBadT); this.lastBadT = ts; }
    _push(ev, scoring) {
      this.events.push(ev); this.events.sort((a, b) => a.t - b.t);
      if (ev.kind === 'shock') this.shocks++;
      this.evSeq++; this.lastEvent = ev;
      if (scoring) this._bad(this.t);
    }
    /** Temps écoulé depuis le dernier événement qui compte (série « fluide »). */
    get streak() { return this.moveStart === null ? 0 : Math.max(0, this.t - this.lastBadT); }

    _detect(kind, x, v, ts) {
      const th = CFG[kind]; let o = this.open[kind];
      if (x >= th.mod) {
        if (!o) this.open[kind] = { t0: ts, peak: x, tPeak: ts, v: v * 3.6, lead: kind === 'brake' ? this._lead(ts) : null };
        else if (x > o.peak) { o.peak = x; o.tPeak = ts; o.v = v * 3.6; }
      } else if (o && x < th.mod * CFG.hysteresis) this._close(kind, ts);
    }
    _close(kind, ts) {
      const o = this.open[kind]; if (!o) return;
      delete this.open[kind];
      if (ts - o.t0 < CFG.minEventS) return;
      const ev = { kind, t: o.tPeak, peak: o.peak, v: o.v, dur: ts - o.t0, sev: o.peak >= CFG[kind].sev ? 2 : 1 };
      // Un virage pris dans un coup de volant reste dans l'historique (jamais supprimé) mais ne pèse que moitié.
      if (kind === 'corner' && this.mute && o.tPeak >= this.mute[0] && o.tPeak <= this.mute[1]) ev.part = true;
      // Deux creux séparés de moins d'une seconde sont le même geste : on prolonge l'événement déjà annoncé.
      const prev = this.lastOf && this.lastOf[kind];
      if (prev && o.t0 - prev.end < 1.0) {
        if (ev.peak > prev.peak) { prev.peak = ev.peak; prev.v = ev.v; prev.sev = Math.max(prev.sev, ev.sev); }
        prev.end = ts; prev.dur = ts - prev.t0; return;
      }
      ev.t0 = o.t0; ev.end = ts;
      (this.lastOf || (this.lastOf = {}))[kind] = ev;
      if (kind === 'brake') ev.late = o.lead === null || o.lead > CFG.lateLead;
      this._push(ev, true);
    }
    /** Accélération longitudinale moyenne entre 4 s et 1,2 s avant le freinage. */
    _lead(ts) {
      const w = this.hist.filter(h => h[0] >= ts - 4 && h[0] <= ts - 1.2);
      return w.length ? w.reduce((s, h) => s + h[1], 0) / w.length : null;
    }

    /** Coup de volant : un pic latéral puis un pic de signe opposé moins de 2,2 s plus tard, avec un fort à-coup. */
    _swerve(x, v, ts) {
      const ax = Math.abs(x), sgn = Math.sign(x), s = this.sg;
      if (s && (sgn !== s.sign || ax < 0.35)) { this._endSeg(s); this.sg = null; }
      if (!this.sg) { if (ax >= 0.35) this.sg = { sign: sgn, peak: ax, tPeak: ts, v }; }
      else if (ax > this.sg.peak) { this.sg.peak = ax; this.sg.tPeak = ts; this.sg.v = v; }
    }
    _endSeg(s) {
      const C = CFG.swerve;
      if (s.peak < C.amp || s.v < C.minSpeed) return;
      const p = this.sgPrev; this.sgPrev = s;
      if (!p || p.sign !== -s.sign || s.tPeak - p.tPeak > C.maxGap) return;
      const gap = Math.max(0.3, s.tPeak - p.tPeak), jerk = (p.peak + s.peak) / gap;
      if (jerk < C.jerkMod) return;
      const lo = p.tPeak - 1.5, hi = s.tPeak + 1.5;
      for (const e of this.events) if (e.kind === 'corner' && e.t >= lo && e.t <= hi) e.part = true;
      if (this.fxQ && this.fxQ.t >= lo && this.fxQ.t <= hi) this.fxQ = null;   // le « redressement » faisait partie du coup de volant
      this.mute = [lo, hi];
      this._push({ kind: 'swerve', t: (p.tPeak + s.tPeak) / 2, peak: Math.min(p.peak, s.peak), jerk, v: s.v * 3.6, dur: gap, sev: jerk >= C.jerkSev ? 2 : 1 }, true);
      this.sgPrev = null;
    }

    /** Redressement : la voiture dérivait doucement, puis le conducteur corrige d'un coup (inattention). */
    _tickFix(ts, v) {
      const C = CFG.fix;
      if (this.fxQ && ts >= this.fxQ.due) { const q = this.fxQ; this.fxQ = null; this._push(q, true); }
      if (!this.gyroOn || v < C.minSpeed) { this.fx = null; return; }
      const y = this.yF / D2R, o = this.fx;
      if (o) {
        const same = Math.sign(y) === o.sign;
        if (same && Math.abs(y) > o.peak) { o.peak = Math.abs(y); o.tPk = ts; }
        const dur = ts - o.t0;
        if (Math.abs(y) < C.end || !same) {
          if (dur <= C.maxDur) this.fxQ = { kind: 'fix', t: o.tPk, peak: o.peak, drift: o.drift, v: o.v, dur, sev: o.peak >= C.sev ? 2 : 1, due: ts + 3 };
          this.fx = null; this.fxLast = ts;
        } else if (dur > C.maxDur) { this.fx = null; this.fxLast = ts; }   // un vrai virage, pas un redressement
        return;
      }
      if (Math.abs(y) < C.spike || ts - this.fxLast < 2.5) return;
      const w = this.ybuf.filter(b => b[0] >= ts - 3.5 && b[0] <= ts - 0.8);
      if (w.length < 20) return;
      const sgn = Math.sign(y); let m = 0, mx = 0, agree = 0;
      for (const b of w) { m += b[1]; mx = Math.max(mx, Math.abs(b[1])); if (Math.sign(b[1]) === -sgn) agree++; }
      m /= w.length; agree /= w.length;
      if (mx <= C.quiet && Math.sign(m) === -sgn && Math.abs(m) >= C.drift && agree >= C.agree) this.fx = { t0: ts, sign: sgn, peak: Math.abs(y), tPk: ts, drift: Math.abs(m), v: v * 3.6 };
    }

    /** Passage de vitesse : creux de l'accélération en pleine accélération, puis reprise. Profondeur et à-coup = brusquerie. */
    _tickShift(ts, v) {
      const C = CFG.shift, cur = this.fLong, h = this.hist;
      const pend = this.shiftPend;
      if (pend) {
        pend.rebMax = Math.max(pend.rebMax, cur);
        if (ts >= pend.rebT) { this.shiftPend = null; this._endShift(pend); }
      }
      const o = this.dip;
      if (o) {
        o.maxSlope = Math.max(o.maxSlope, Math.abs(cur - o.prevC) / 0.1); o.prevC = cur;
        if (cur < o.min) { o.min = cur; o.tMin = ts; }
        if (cur >= o.pre - C.recover) {
          if (o.tMin - o.t0 <= C.maxFall && ts - o.t0 <= C.maxDip && !this.shiftPend) { o.rebMax = cur; o.rebT = ts + 0.5; this.shiftPend = o; }
          this.dip = null;
        } else if (ts - o.t0 > C.maxDip) this.dip = null;
        return;
      }
      if (v < 2) return;
      const w = h.filter(b => b[0] >= ts - 3.2 && b[0] <= ts - 1.0);
      if (w.length < 12) return;
      let pre = 0, mn = Infinity; for (const b of w) { pre += b[2]; mn = Math.min(mn, b[2]); }
      pre /= w.length;
      if (pre < C.preMin || mn < C.preMin * 0.5) return;
      const prev = h.length > 1 ? h[h.length - 2][2] : cur;
      if (cur <= pre - C.open && cur < prev) this.dip = { t0: ts, pre, min: cur, tMin: ts, prevC: cur, maxSlope: 0, v: v * 3.6 };
    }
    _endShift(o) {
      const C = CFG.shift, depth = o.pre - o.min, reb = Math.max(0, o.rebMax - o.pre);
      this.shiftN++;
      const sev = depth < C.minDepth ? 0 : depth >= C.sev || o.maxSlope >= C.slopeSev ? 2 : depth >= C.harsh || o.maxSlope >= C.slope || reb >= C.reb ? 1 : 0;
      if (sev) this._push({ kind: 'shift', t: o.tMin, peak: depth, jerk: o.maxSlope, reb, v: o.v, dur: o.rebT - o.t0, sev }, true);
    }

    _shockCheck(vh, sR, v, ts) {
      const x = Math.abs(vh), th = CFG.shock, o = this.shock, rel = Math.sign(vh) * sR;
      if (o) {
        if (x > o.peak) { o.peak = x; o.rel = rel; }
        if (ts - o.t0 >= 0.25) this._closeShock(ts);
      } else if (x >= Math.max(th.mod, th.noiseK * this.vNoise) && v >= CFG.minShockSpeed && ts - this.lastShock > CFG.shockRefractory) {

    _closeShock(ts) {
      const o = this.shock; if (!o) return;
      const ratio = o.rel / o.peak;
      const side = !this.f ? null : Math.abs(ratio) <= CFG.sideRatio ? 'both' : !this.latLearned && this.mount !== 'vent' ? 'one' : ratio > 0 ? 'left' : 'right';
      // Un dos-d'âne franchi trop vite est un défaut d'anticipation du conducteur ; un nid-de-poule, non.
      const fast = side === 'both' && o.v >= CFG.bump.fastKmh && o.peak >= CFG.bump.peak;
      this._push({ kind: 'shock', t: o.t0, peak: o.peak, v: o.v, dur: 0.25, sev: o.peak >= CFG.shock.sev ? 2 : 1, side, fast }, fast);
      this.shock = null; this.lastShock = ts;
    }

    finish() {
      for (const k of Object.keys(this.open)) this._close(k, this.t);
      if (this.sg) { this._endSeg(this.sg); this.sg = null; }
      if (this.fxQ) { const q = this.fxQ; this.fxQ = null; this._push(q, true); }
      if (this.shiftPend) { const p = this.shiftPend; this.shiftPend = null; this._endShift(p); }

    }

    summary() {
      const km = this.dist / 1000, base = Math.max(km, CFG.minKm);
      const wt = e => e.kind === 'shock' ? 1 : (e.sev === 2 ? 2 : 1) * (e.late ? 1.4 : 1) * (e.part ? 0.5 : 1);
      const wsum = f => this.events.reduce((s, e) => f(e) ? s + wt(e) : s, 0);
      const expo = (w, k) => 100 * Math.exp(-(w / base) / k);
      const inten = (k) => { const p = this._p90(k); return p === null ? null : 100 * lin(p, CFG.inten[k][0], CFG.inten[k][1]); };
      const mix = (E, I) => Math.round(I === null ? E : 0.6 * E + 0.4 * I);
      const cnt = f => this.events.filter(f).length;
      const rms = this.jerkT > 5 ? Math.sqrt(this.jerkSq / this.jerkT) : null;
      const steerRms = this.gyroOn && this.steerT > 20 ? Math.sqrt(this.steerSq / this.steerT) : null;
      const nShift = this.shiftN, shiftW = wsum(e => e.kind === 'shift');

      const J = rms === null ? 100 : 100 * lin(rms, CFG.jerk[0], CFG.jerk[1]);
      const Rv = steerRms === null ? null : 100 * lin(steerRms, CFG.steer[0], CFG.steer[1]);
      const axes = {
        freinage: mix(expo(wsum(e => e.kind === 'brake' || (e.kind === 'shock' && e.fast)), AXIS_K.freinage), inten('brake')),
        acceleration: mix(expo(wsum(e => e.kind === 'accel'), AXIS_K.acceleration), inten('accel')),
        virages: mix(expo(wsum(e => e.kind === 'corner'), AXIS_K.virages), inten('corner')),
        trajectoire: mix(expo(wsum(e => e.kind === 'swerve' || e.kind === 'fix'), AXIS_K.trajectoire), Rv),

        avgKmh: moving > 5 ? km / (moving / 3600) : 0, maxKmh: this.maxV,
        counts: {
          brake: cnt(e => e.kind === 'brake'), late: cnt(e => e.late), accel: cnt(e => e.kind === 'accel'), corner: cnt(e => e.kind === 'corner'),
          swerve: cnt(e => e.kind === 'swerve'), fix: cnt(e => e.kind === 'fix'), shift: nShift, shiftHarsh: cnt(e => e.kind === 'shift'),

  /* ---------- Simulateur : trajet de démonstration (téléphone sur la grille ou posé au hasard) ---------- */

  };
  const STYLE = { calm: [1, 0.45, 0.75, 1], normal: [1, 1, 1, 1], rough: [1.1, 1.3, 1.1, 0] };   // 3 = ralentir avant le dos d'âne (sauf conducteur nerveux)
  const WANDER = { calm: 0.35, normal: 0.6, rough: 1.0 };

    ? { t0: p.t0, d: (p.d - TR) / k + TR, a: p.a * k }

  }

  /* ---------- Import CSV : t, ax, ay, az, speed[, heading][, gx, gy, gz en °/s] ---------- */
  function parseCsv(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());

    const split = l => l.split(delim).map(s => s.trim().replace(/^"|"$/g, ''));
    let idx = { t: 0, ax: 1, ay: 2, az: 3, speed: 4, heading: -1, gx: -1, gy: -1, gz: -1 }, start = 0;
    const head = split(lines[0]);

      const f = { t: find(['t','time','timestamp','seconds']), ax: find(['ax','x']), ay: find(['ay','y']),
                  az: find(['az','z']), speed: find(['speed','v','vitesse']), heading: find(['heading','bearing','course','cap']),
                  gx: find(['gx','gyrox','rotx']), gy: find(['gy','gyroy','roty']), gz: find(['gz','gyroz','rotz']) };

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = n => String(n).padStart(2, '0'); return (h ? h + ':' + p(m) : p(m)) + ':' + p(x); };

/* ---------- Vocabulaire ---------- */
const KIND = {
  brake:  { name: 'Freinage brusque',          cls: 'brake' },
  accel:  { name: 'Accélération vive',         cls: 'accel' },
  corner: { name: 'Virage serré',              cls: 'corner' },
  swerve: { name: 'Coup de volant',            cls: 'swerve' },
  fix:    { name: 'Redressement brusque',      cls: 'fix' },
  shift:  { name: 'Passage de vitesse brusque', cls: 'shift' },
  shock:  { name: 'Choc de chaussée',          cls: 'shock' }
};
const SIDE = { left: 'Nid-de-poule à gauche', right: 'Nid-de-poule à droite', both: 'Dos d’âne', one: 'Nid-de-poule' };
const evName = e => e.kind === 'brake' && e.late ? 'Freinage tardif'
  : e.kind === 'shock' ? (e.fast ? 'Dos d’âne trop vite' : SIDE[e.side] || KIND.shock.name) : KIND[e.kind].name;
const scoring = e => e.kind !== 'shock' || e.fast;
const AXES = [['freinage', 'Freinage'], ['acceleration', 'Accélération'], ['virages', 'Virages'], ['trajectoire', 'Volant'], ['fluidite', 'Fluidité']];
const tone = s => s >= 70 ? 'good' : s >= 50 ? 'warn' : 'bad';
const grade = s => s >= 85 ? 'Exemplaire' : s >= 70 ? 'Fluide' : s >= 50 ? 'Correct' : s >= 30 ? 'Brusque' : 'Agressif';
const dateLabel = ts => new Date(ts).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
const CHIPS = [['brake', 'Freinage'], ['accel', 'Accélération'], ['corner', 'Virage'], ['swerve', 'Volant'], ['fix', 'Redressement'], ['shift', 'Vitesse'], ['shock', 'Choc']];
// Même fonction en direct et dans l'historique, calculée sur la liste d'événements : les deux ne peuvent pas diverger.
const chipsHTML = evs => { const c = {}; for (const e of evs) c[e.kind] = (c[e.kind] || 0) + 1; return CHIPS.filter(([k]) => c[k]).map(([k, l]) => `<span class="chip"><i class="mk ${k}"></i>${l} <b>${c[k]}</b></span>`).join(''); };

// Texte court par axe : ce qui s'est passé, puis le conseil le plus utile.
function axisInfo(k, s) {
  const c = s.counts, j = [];
  if (k === 'freinage') {
    if (c.brake) j.push(plural(c.brake, 'brusque')); if (c.late) j.push(plural(c.late, 'tardif')); if (c.fast) j.push(plural(c.fast, 'dos d’âne trop vite').replace('dos d’âne trop vites', 'dos d’âne trop vite'));
    return { detail: j.join(' · '), advice: c.late ? 'Lève le pied dès que tu vois l’obstacle : freine plus tôt, moins fort.' : c.fast ? 'Ralentis avant les dos d’âne.' : 'Freine plus tôt et plus progressivement.' };
  }
  if (k === 'acceleration') return { detail: c.accel ? plural(c.accel, 'vive') : '', advice: 'Appuie sur l’accélérateur progressivement.' };
  if (k === 'virages') return { detail: c.corner ? plural(c.corner, 'serré') : '', advice: 'Ralentis avant le virage, pas dedans.' };
  if (k === 'trajectoire') {

/* ---------- Stockage local (facultatif) ---------- */
const KEY = 'pied-leger:trips:v3';
let mem = [];
const loadTrips = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : mem; } catch (e) { return mem; } };

const DKEY = 'pied-leger:draft:v1';
/* ---------- État ---------- */
const S = { tab: 'drive', run: null, error: '', opened: null, confirm: '' };
let trips = loadTrips();
const makeTrip = (engine, meta) => ({
  id: meta.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: meta.ts || Date.now(), cal: engine.status === 'ready',
  sum: engine.summary(), events: engine.events,
  series: engine.series.map(p => ({ t: p.t, v: Math.round(p.v * 10) / 10 }))

// Sauvegarde de secours toutes les 5 s : si la page est tuée en route, le trajet est récupéré à la réouverture.

let shown = trips[0] || null;

/* ---------- Gabarits ---------- */

    for (const k of [-1, 1]) for (const d of [5, 10, 15]) { const xx = mid + k * d / 20 * bw / 2; ctx.beginPath(); ctx.moveTo(xx, by + 1); ctx.lineTo(xx, by + bh - 1); ctx.stroke(); }
    ctx.strokeStyle = col('--ink'); ctx.beginPath(); ctx.moveTo(mid, by - 2); ctx.lineTo(mid, by + bh + 2); ctx.stroke();
    ctx.fillStyle = col('--muted'); ctx.textAlign = 'left'; ctx.fillText('G', bx + 2, by - 9); ctx.textAlign = 'right'; ctx.fillText('D', bx + bw - 2, by - 9);
  } else if (e.t > 3) { ctx.fillStyle = col('--muted'); ctx.font = '12px ' + col('--font-body'); ctx.fillText('Gyroscope indisponible', mid, by + 11); }
}

const pointsOf = (s0, s1) => s1 - s0;
function updateLive() {
  const r = S.run; if (!r || !$('#l-score')) return;
  const e = r.engine, s = e.summary(), C = 2 * Math.PI * 56, ready = e.status === 'ready';
  $('#l-score').textContent = s.score;
  const rg = $('#l-score-ring'); rg.setAttribute('stroke-dashoffset', (C * (1 - s.score / 100)).toFixed(1)); rg.setAttribute('class', 'pg rc-' + tone(s.score));
  $('#l-speed').textContent = fmt((e.speed || 0) * 3.6);
  $('#l-line').textContent = `${fmt(s.km, 1)} km · ${clock(s.durationS)}`;
  $('#l-streak').textContent = clock(e.streak).replace(/^0/, '');
  const st = $('#l-status');
  st.className = 'status' + (ready ? ' ok' : '');
  st.lastElementChild.textContent = e.status === 'init' ? 'Mesure…' : ready ? (r.gpsWarn ? 'Calé · GPS faible' : 'Calé') : e.recalCount ? 'Recalage : accélère en ligne droite' : 'Calage : accélère en ligne droite';
  const pause = performance.now() - r.lastMotion > 2500, bn = $('#l-banner');
  bn.hidden = !pause; if (pause) bn.textContent = 'Capteurs en pause : garde l’écran allumé et l’appli au premier plan.';
  if (r.chipN !== e.events.length) { r.chipN = e.events.length; $('#l-chips').innerHTML = chipsHTML(e.events); }
  for (const [k] of AXES) { const row = $('#ax-' + k), v = s.axes[k]; row.querySelector('i').style.width = v + '%'; row.querySelector('i').className = 'g-' + tone(v); row.querySelector('.v').textContent = v; }

  // Bandeau : dernier événement pendant 6 s, avec les points perdus ; sinon « conduite fluide ».
  const tb = $('#l-toast'), now = performance.now();
  if (r.seq !== e.evSeq) {
    const ev = e.lastEvent, first = r.seq === -1; r.seq = e.evSeq;
    if (ev && !first) r.toast = { ev, d: scoring(ev) ? pointsOf(r.score, s.score) : 0, until: now + 6000 };
  }
  r.score = s.score;
  if (r.toast && now > r.toast.until) r.toast = null;
  const T = r.toast, key = T ? e.evSeq : 'ok';
  if (r.toastKey !== key) {
    r.toastKey = key;
    tb.className = 'toast ' + (!T ? 'ok' : !scoring(T.ev) ? 'i' : T.ev.sev === 2 ? 'b' : 'w') + (T ? ' pop' : '');
    $('#l-tmk').className = 'mk ' + (T ? KIND[T.ev.kind].cls : '');
    $('#l-tt').textContent = T ? evName(T.ev) : 'Conduite fluide';
    $('#l-ts').textContent = T ? evSub(T.ev) : s.counts.brake + s.counts.accel + s.counts.corner + s.counts.swerve + s.counts.fix + s.counts.shiftHarsh ? `Record ${clock(s.streakBest)}` : 'Rien à signaler';
    $('#l-tp').textContent = T && T.d < 0 ? T.d : '';
  }
}
function paint() {
  const r = S.run; if (!r) return;
  const c = $('#gg'); if (c) drawCockpit(c, r.engine, r.engine.status === 'ready');
  r.raf = requestAnimationFrame(paint);
}

/* ---------- Sources ---------- */
const BLOCKED = 'Capteurs indisponibles ici (permission refusée, ou aperçu intégré bloqué). Autorise le mouvement et la position, ou ouvre la version hébergée en HTTPS sur ton téléphone.';
let wake = null;
const lock = () => { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(l => { wake = l; }).catch(() => {}); } catch (e) {} };
const unlock = () => { try { if (wake) wake.release(); } catch (e) {} wake = null; };
const fail = msg => { stopSources(); S.run = null; S.error = msg; render(); };
const hav = (a, b, c, d) => { const R = 6371000, p = Math.PI / 180, x = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };

function stopSources() {
  const r = S.run; unlock(); if (!r) return;
  if (r.raf) cancelAnimationFrame(r.raf);
  if (r.onMotion) window.removeEventListener('devicemotion', r.onMotion);
  if (r.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(r.watch);
  if (r.onVis) { document.removeEventListener('visibilitychange', r.onVis); window.removeEventListener('pagehide', r.onHide); }
  clearTimeout(r.watchdog); clearInterval(r.loop); clearInterval(r.saver);
}

async function startSensors() {
  if (typeof DeviceMotionEvent === 'undefined' || !navigator.geolocation) return fail(BLOCKED);
  try {
    if (typeof DeviceMotionEvent.requestPermission === 'function' && await DeviceMotionEvent.requestPermission() !== 'granted') return fail(BLOCKED);
  } catch (e) { return fail(BLOCKED); }
  const engine = new PL.Engine({ mount: 'free' }), now = () => performance.now() / 1000;
  const r = S.run = { engine, got: false, lastPos: null, gpsWarn: false, seq: -1, score: 100, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), lastMotion: performance.now() };
  render(); lock();
  r.onMotion = ev => {
    const a = ev.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null || a.z == null) return;
    const g = ev.rotationRate;   // °/s : alpha = axe z, beta = axe x, gamma = axe y de l'appareil
    r.got = true; r.lastMotion = performance.now(); engine.pushMotion(now(), a.x, a.y, a.z, g ? g.beta : null, g ? g.gamma : null, g ? g.alpha : null);
  };
  window.addEventListener('devicemotion', r.onMotion);
  r.watch = navigator.geolocation.watchPosition(pos => {
    const c = pos.coords; let v = c.speed;
    if (v == null || Number.isNaN(v)) { v = 0; if (r.lastPos) { const dt = (pos.timestamp - r.lastPos.ts) / 1000; if (dt > 0) v = hav(r.lastPos.lat, r.lastPos.lon, c.latitude, c.longitude) / dt; } }
    r.lastPos = { lat: c.latitude, lon: c.longitude, ts: pos.timestamp }; r.gpsWarn = false;
    engine.pushFix(now(), Math.max(0, v), c.heading);
  }, err => { if (err.code === 1) fail(BLOCKED); else r.gpsWarn = true; },
  { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
  r.watchdog = setTimeout(() => { if (!r.got) fail(BLOCKED); }, 3000);
  r.loop = setInterval(updateLive, 200);
  r.saver = setInterval(saveDraft, 5000);
  r.onVis = () => { if (document.hidden) saveDraft(); else lock(); }; r.onHide = saveDraft;
  document.addEventListener('visibilitychange', r.onVis); window.addEventListener('pagehide', r.onHide);
  r.raf = requestAnimationFrame(paint);
}

function finishRun() {
  const r = S.run; if (!r) return; const engine = r.engine; stopSources();
  engine.finish();
  if (engine.dist < 100 || engine.t < 20) { S.run = null; clearDraft(); S.error = 'Trajet trop court (moins de 100 m ou 20 s) : non enregistré.'; return render(); }
  if (engine.status !== 'ready') { S.run = null; clearDraft(); S.error = 'Calage impossible : aucune accélération franche en ligne droite. Redémarre et accélère doucement.'; return render(); }
  const t = makeTrip(engine, { id: r.id, ts: r.ts }); trips = [t, ...trips].slice(0, 30); saveTrips(trips); clearDraft();
  S.run = null; S.error = ''; shown = t; S.tab = 'drive'; render();
  const h = document.querySelector('#view-drive article'); if (h && h.scrollIntoView) h.scrollIntoView({ block: 'start' });
}

/* ---------- Événements ---------- */
$('#app').addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.confirm = ''; return render(); }
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === 'go') { S.error = ''; startSensors(); }
  else if (act === 'stop') finishRun();
  else if (act === 'recal') { if (S.run) { S.run.engine.recalibrate(); updateLive(); } }
  else if (act === 'open') { S.opened = id; S.confirm = ''; renderHistory(); }
  else if (act === 'back') { S.opened = null; S.confirm = ''; renderHistory(); }
  else if (act === 'del') {
    if (S.confirm !== 'del' + id) { S.confirm = 'del' + id; return renderHistory(); }
    trips = trips.filter(t => t.id !== id); saveTrips(trips); S.opened = null; S.confirm = ''; shown = trips[0] || null; renderHistory();
  } else if (act === 'clear') {
    if (S.confirm !== 'clear') { S.confirm = 'clear'; return renderHistory(); }
    trips = []; saveTrips(trips); S.confirm = ''; shown = null; renderHistory();
  }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!S.run) render(); }, 200); });
render();
})();
</script>
</body></html>
